<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2761">
<title>Rig AMP Reports</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF2F6; --surface-3:#E4E9F0;
  --ink:#121826; --ink-2:#2A3342; --ink-muted:#5B6472; --ink-faint:#8892A0;
  --border:#DEE3EA; --grid:#E8ECF1;
  --brand:#1E2761; --brand-ink:#1E2761; --brand-soft:#EAEDF7; --copper:#B8763A; --copper-soft:#F7EDE3;
  --head-bg:#1E2761; --on-solid:#FFFFFF;
  --good:#1F7A4D; --good-bg:#E4F3EA; --good-line:#BFE1CC; --good-solid:#1F7A4D;
  --fair:#8F5C00; --fair-bg:#FBF1DA; --fair-line:#EDD8A6; --fair-solid:#A86B00;
  --bad:#B23A2E; --bad-bg:#FBE9E6; --bad-line:#F0C4BD; --bad-solid:#B23A2E;
  --pending:#5B6472; --pending-bg:#EAEDF1; --pending-line:#D6DCE3; --neutral-solid:#3A4352; --copper-solid:#9A5B22;
  --st-good:#0ca30c; --st-fair:#fab219; --st-bad:#d03b3b; --st-pending:#C3CAD4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --shadow:0 1px 2px rgba(18,24,38,.04), 0 6px 20px -8px rgba(18,24,38,.14);
  --overlay:rgba(18,24,38,.42);
  --font-display:'Barlow Condensed',"Arial Narrow",Arial,sans-serif;
  --font-body:'IBM Plex Sans',"Segoe UI",Arial,sans-serif;
  --font-mono:'IBM Plex Mono',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0D1117; --surface:#141A23; --surface-2:#1B2330; --surface-3:#232C3B;
    --ink:#E8EBF0; --ink-2:#C9D0DA; --ink-muted:#9BA4B2; --ink-faint:#6C7684;
    --border:#2A323D; --grid:#222A35;
    --brand:#7C9BD1; --brand-ink:#9DB6E0; --brand-soft:#1C2740; --copper:#D19A5C; --copper-soft:#33251A;
    --head-bg:#26345F; --on-solid:#FFFFFF;
    --good:#4FAE79; --good-bg:#173226; --good-line:#265B41; --good-solid:#1E5E3E;
    --fair:#DDA83E; --fair-bg:#332A12; --fair-line:#5C4A1E; --fair-solid:#7A5410;
    --bad:#E2695C; --bad-bg:#3A1F1C; --bad-line:#63332C; --bad-solid:#8A2E25;
    --pending:#9BA4B2; --pending-bg:#232A34; --pending-line:#333D4A; --neutral-solid:#2E3746; --copper-solid:#7A4A1E;
    --st-pending:#3A4452;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0D1117; --surface:#141A23; --surface-2:#1B2330; --surface-3:#232C3B;
  --ink:#E8EBF0; --ink-2:#C9D0DA; --ink-muted:#9BA4B2; --ink-faint:#6C7684;
  --border:#2A323D; --grid:#222A35;
  --brand:#7C9BD1; --brand-ink:#9DB6E0; --brand-soft:#1C2740; --copper:#D19A5C; --copper-soft:#33251A;
  --head-bg:#26345F; --on-solid:#FFFFFF;
  --good:#4FAE79; --good-bg:#173226; --good-line:#265B41; --good-solid:#1E5E3E;
  --fair:#DDA83E; --fair-bg:#332A12; --fair-line:#5C4A1E; --fair-solid:#7A5410;
  --bad:#E2695C; --bad-bg:#3A1F1C; --bad-line:#63332C; --bad-solid:#8A2E25;
  --pending:#9BA4B2; --pending-bg:#232A34; --pending-line:#333D4A; --neutral-solid:#2E3746; --copper-solid:#7A4A1E;
  --st-pending:#3A4452;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.005em}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand-ink)}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
code{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px;word-break:break-word}
.wrap{max-width:1440px;margin:0 auto;padding-inline:24px}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;padding-block:20px 16px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--copper)}
.back{font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink-muted)}
.back:hover{color:var(--ink)}
.title{font-size:40px;line-height:1;margin-top:6px}
.title .rig{color:var(--brand-ink)}
.subtitle{color:var(--ink-muted);margin-top:6px;font-size:14px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:var(--ink-muted)}
.facts b{font-weight:600;color:var(--ink-2)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--head-bg);border-color:var(--head-bg);color:var(--on-solid)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn svg{width:15px;height:15px;flex:none}
.linkbtn{border:0;background:none;padding:0;color:var(--brand-ink);font-weight:600;cursor:pointer;font-family:var(--font-mono);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-muted);padding:0 4px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st-pending)}
.sync.ok::before{background:var(--st-good)}
.sync.busy::before{background:var(--st-fair)}
.sync.bad{color:var(--bad)} .sync.bad::before{background:var(--st-bad)}
.sync:empty{display:none}

/* tabs + formula bar (one sticky block) */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.tabrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.tabrow:empty{display:none}
.tab{flex:none;border:0;background:none;padding:12px 12px 10px;font-size:13px;font-weight:500;color:var(--ink-muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--copper)}
.tab.ov{font-weight:600}
.tab .n{font-family:var(--font-mono);font-size:10.5px;color:var(--copper);margin-left:6px}
.fbar{border-top:1px solid var(--border);background:var(--surface)}
.fbrow{display:flex;align-items:center;gap:8px;padding-block:7px;flex-wrap:wrap}
.fbref{font-family:var(--font-mono);font-size:12px;font-weight:600;min-width:64px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);padding:0 8px}
.fx{font-family:Georgia,serif;font-style:italic;color:var(--ink-faint);font-size:14px}
#fbInput{flex:1 1 320px;min-width:0;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:0 10px;font-size:13px}
#fbInput:focus{border-color:var(--copper);outline:none;box-shadow:0 0 0 2px var(--copper-soft)}
#fbInput[readonly]{color:var(--ink-muted)}
.fbnote{font-size:12px;color:var(--ink-muted);flex:1 1 100%}
.fbnote:empty{display:none}

main{padding-block:22px 64px}
.view[hidden]{display:none}
.sheet-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.sheet-head h2{font-size:26px;line-height:1.1}
.sheet-head .dims{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint)}
.sheet-head .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:14px}
.loading{display:flex;align-items:center;gap:12px;color:var(--ink-muted);padding:40px 4px}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--surface-3);border-top-color:var(--copper);flex:none}
@media (prefers-reduced-motion:no-preference){ .spinner{animation:spin .8s linear infinite} @keyframes spin{to{transform:rotate(360deg)}} }

/* workbook grid */
.xwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px}
table.xg{border-collapse:collapse;table-layout:fixed;font-size:12.5px;color:var(--ink)}
.xg td{padding:4px 7px;height:24px;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;position:relative}
.xg td.wr{white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word}
.xg td.bd{border-color:var(--grid)}
.xg tr.sp td{height:10px;padding:0}
.xg .b{font-weight:600}.xg .i{font-style:italic}.xg .u{text-decoration:underline}
.xg .ac{text-align:center}.xg .ar{text-align:right}.xg .vt{vertical-align:top}
.xg .num{font-variant-numeric:tabular-nums}
.xg .fs-xl{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.15;letter-spacing:.01em}
.xg .fs-l{font-size:15px;font-weight:600}
.xg .fs-s{font-size:11px}
.err{color:var(--ink-faint);font-family:var(--font-mono);font-size:11px}
.f-neutral-soft{background:var(--surface-2)} .f-neutral-solid{background:var(--neutral-solid);color:var(--on-solid)}
.f-brand-soft{background:var(--brand-soft)} .f-brand-solid{background:var(--head-bg);color:var(--on-solid)}
.f-good-soft{background:var(--good-bg)} .f-good-solid{background:var(--good-solid);color:var(--on-solid)}
.f-fair-soft{background:var(--fair-bg)} .f-fair-solid{background:var(--fair-solid);color:var(--on-solid)}
.f-bad-soft{background:var(--bad-bg)} .f-bad-solid{background:var(--bad-solid);color:var(--on-solid)}
.f-copper-soft{background:var(--copper-soft)} .f-copper-solid{background:var(--copper-solid);color:var(--on-solid)}
.xg td[class*="-solid"]{border-color:transparent}
.tc-good{color:var(--good)}.tc-fair{color:var(--fair)}.tc-bad{color:var(--bad)}.tc-brand{color:var(--brand-ink)}.tc-muted{color:var(--ink-muted)}
table.xg td[data-c], table.dtab td[data-c]{cursor:cell}
td.sel{box-shadow:inset 0 0 0 2px var(--copper)}
td.ed::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent var(--copper) transparent transparent}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:0 8px 0 7px;height:20px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid;line-height:1;white-space:nowrap;vertical-align:middle}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.good{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}
.chip.fair{color:var(--fair);background:var(--fair-bg);border-color:var(--fair-line)}
.chip.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.chip.pending{color:var(--pending);background:var(--pending-bg);border-color:var(--pending-line)}

/* searchable tables */
.dt{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint)}
.search input{width:100%;height:34px;border:1px solid var(--border);border-radius:7px;background:var(--bg);padding:0 10px 0 30px;font-size:13px}
.tbar .count{font-size:12.5px;color:var(--ink-muted)}
.tbar .sp{flex:1}
.dt-scroll{max-height:min(70vh,900px);overflow:auto}
table.dtab{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.dtab th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;vertical-align:bottom;padding:8px 8px 7px;border-bottom:1px solid var(--border);font-weight:600;color:var(--ink-2);min-width:70px}
.dtab th .hl{display:flex;align-items:flex-start;gap:4px;border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-align:left;font-size:12px;line-height:1.3;white-space:normal;max-width:260px}
.dtab th .arw{color:var(--ink-faint);font-size:10px;margin-top:2px}
.dtab th select{margin-top:5px;width:100%;min-width:80px;max-width:200px;height:26px;font-size:12px;border:1px solid var(--border);border-radius:5px;background:var(--surface);padding:0 4px}
.dtab th select.on{border-color:var(--copper);box-shadow:0 0 0 1px var(--copper)}
.dtab td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top;white-space:nowrap;position:relative}
.dtab td.long{white-space:normal;min-width:220px;max-width:420px}
.dtab td.num{text-align:right;font-variant-numeric:tabular-nums}
.dtab td.rn{color:var(--ink-faint);font-family:var(--font-mono);font-size:10.5px;text-align:right;padding-right:4px}
.dtab th.rn{min-width:40px}
.dtab tbody tr:hover td{background:var(--surface-2)}
.dtab tr.newrow td{background:transparent;color:var(--ink-faint);height:30px}
.dtab tr.newrow td.rn{color:var(--copper);font-weight:600;font-size:13px}
.dtab tr.rev td{color:var(--ink-muted)}
.empty{padding:28px;text-align:center;color:var(--ink-muted)}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.card h3{font-size:19px;line-height:1.15}
.card .note,.note{font-size:12px;color:var(--ink-muted);margin-top:2px}
.chart{margin-top:10px;min-height:60px}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font-body)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dleg{display:grid;grid-template-columns:auto 1fr auto auto;gap:5px 10px;font-size:12.5px;align-items:center;min-width:180px}
.dleg i{width:10px;height:10px;border-radius:3px}
.dleg .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.dleg .p{color:var(--ink-faint);text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:7px;padding:6px 9px;font-size:12px;max-width:280px}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;font-weight:600;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.kpi .l .dot{width:8px;height:8px;border-radius:50%}
.kpi .v{font-family:var(--font-display);font-size:38px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:20px;color:var(--ink-muted);font-weight:600;margin-left:2px}
.kpi .s{font-size:12px;color:var(--ink-muted)}
.meter{height:6px;border-radius:3px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--s1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ptitle .note{margin:0}
.sys{width:100%;border-collapse:collapse;font-size:13px}
.sys th{font-size:11.5px;font-weight:600;color:var(--ink-muted);text-align:left;padding:0 10px 8px 0;border-bottom:1px solid var(--border);white-space:nowrap}
.sys td{padding:9px 10px 9px 0;border-bottom:1px solid var(--grid);vertical-align:middle}
.sys tr.tot td{border-bottom:0;font-weight:600;border-top:1px solid var(--border)}
.sys .nm{font-weight:600;white-space:nowrap}
.sys .n{text-align:right;font-variant-numeric:tabular-nums;padding-right:18px}
.pbar{display:flex;align-items:center;gap:10px;min-width:170px}
.pbar .trk{flex:1;height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:70px}
.pbar .trk i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.pbar .t{font-size:12px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:92px}
.pbar .t b{color:var(--ink);font-weight:600}
.stackbar{display:flex;height:10px;border-radius:4px;overflow:hidden;gap:2px;min-width:120px}
.stackbar i{display:block;height:100%}
.stackbar.big{height:22px;border-radius:5px}
.cleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.cleg div{display:flex;flex-direction:column;gap:1px;padding-left:12px;border-left:3px solid var(--c)}
.cleg .k{font-size:12px;color:var(--ink-muted)}
.cleg .n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.cleg .n small{font-family:var(--font-body);font-size:12px;color:var(--ink-faint);font-weight:500;margin-left:5px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb .trk{height:12px;background:var(--surface-3);border-radius:0 4px 4px 0;overflow:hidden}
.hb .trk i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink-muted);white-space:nowrap}
.hb .v b{color:var(--ink);font-weight:600}
.olist{width:100%;border-collapse:collapse;font-size:12.5px}
.olist th{font-size:11.5px;font-weight:600;color:var(--ink-muted);text-align:left;padding:0 10px 7px 0;border-bottom:1px solid var(--border);white-space:nowrap}
.olist td{padding:8px 10px 8px 0;border-bottom:1px solid var(--grid);vertical-align:top}
.olist td.txt{min-width:240px}

          if (!row){ row = mk('row'); row.setAttribute('r', r); sd.insertBefore(row, kids(sd, 'row').find(x => +x.getAttribute('r') > r) || null); }
          let cell = kids(row, 'c').find(c => refOf(c.getAttribute('r')).c === plan.to);
          if (!cell){
            cell = mk('c'); cell.setAttribute('r', addr(r, plan.to));
            const left = kids(row, 'c').find(c => refOf(c.getAttribute('r')).c === plan.to - 1);
            if (left && left.getAttribute('s')) cell.setAttribute('s', left.getAttribute('s'));
            row.insertBefore(cell, kids(row, 'c').find(c => refOf(c.getAttribute('r')).c > plan.to) || kid(row, 'extLst'));
          }
          if (!+(cell.getAttribute('s') || 0)){          // a placeholder header without a format of its own looks like its neighbour
            const left = kids(row, 'c').find(c => refOf(c.getAttribute('r')).c === plan.to - 1);
            if (left && +(left.getAttribute('s') || 0)) cell.setAttribute('s', left.getAttribute('s'));
          }
          if (!plan.keepHeader){                         // an existing Yard Maintenance Date header keeps its own text
            for (const n of ['f', 'v', 'is']){ const x = kid(cell, n); if (x) cell.removeChild(x); }
            const v = mk('v');
            if (sstDoc){ cell.setAttribute('t', 's'); v.textContent = String(sstIndex(plan.header)); cell.appendChild(v); }
            else { cell.setAttribute('t', 'inlineStr'); const is = mk('is'), t = mk('t'); t.textContent = clean(plan.header); is.appendChild(t); cell.appendChild(is); }
          }
        }
        // sheet size
        const dim = kid(ws, 'dimension');
        if (dim){ let r1 = Infinity, c1 = Infinity, r2 = 0, c2 = 0; for (const c of all(sd, 'c')){ const p = refOf(c.getAttribute('r')); if (!p) continue; r1 = Math.min(r1, p.r); r2 = Math.max(r2, p.r); c1 = Math.min(c1, p.c); c2 = Math.max(c2, p.c); } if (r2) dim.setAttribute('ref', r1 === r2 && c1 === c2 ? addr(r1, c1) : `${addr(r1, c1)}:${addr(r2, c2)}`); }
      }
    }
    // texts of format rules and drop-down lists (in the sheet and in its Excel 2010 extensions)
    for (const n of ['formula', 'formula1', 'formula2']) for (const el of all(ws, n)) if (kid(el, 'f') == null && reText(el, own)) changed = true;
    for (const ext of kids(ws, 'extLst')) for (const el of all(ext, 'f')) if (reText(el, own)) changed = true;
    if (isT){
      for (const tag of ['conditionalFormatting', 'dataValidation', 'protectedRange', 'ignoredError', 'selection']) for (const el of all(ws, tag)) if (el.getAttribute('sqref')) el.setAttribute('sqref', mapSqref(el.getAttribute('sqref'), mv));
      for (const el of all(ws, 'sqref')) el.textContent = mapSqref(el.textContent, mv);
      for (const tag of ['mergeCell', 'hyperlink', 'sortCondition', 'sortState']) for (const el of all(ws, tag)) if (el.getAttribute('ref')) el.setAttribute('ref', mapArea(el.getAttribute('ref'), mv));
      for (const el of all(ws, 'pane')) if (el.getAttribute('topLeftCell')) el.setAttribute('topLeftCell', mapArea(el.getAttribute('topLeftCell'), mv));
      for (const el of all(ws, 'selection')) if (el.getAttribute('activeCell')) el.setAttribute('activeCell', mapArea(el.getAttribute('activeCell'), mv));
      const af = kid(ws, 'autoFilter'); if (af) moveFilter(af, mv);
      if (kid(ws, 'colBreaks')) warnings.push(`${target}: page breaks between columns were not moved`);
      // column widths and formats
      const cols = kid(ws, 'cols'), per = new Map();
      if (cols) for (const c of kids(cols, 'col')){ const at = {}; for (const x of Array.from(c.attributes)) if (x.name !== 'min' && x.name !== 'max') at[x.name] = x.value; for (let i = +c.getAttribute('min'); i <= +c.getAttribute('max') && i <= 16384; i++) per.set(i, at); }
      const np = new Map(); for (const [c, at] of per){ const n = mv.pos(c); if (n <= 16384) np.set(n, at); }
      if (plan.width){ const cur = np.get(plan.to); if (!cur || !cur.width || cur.hidden === '1' || +cur.width < plan.width) np.set(plan.to, Object.assign({}, cur || {}, {width: String(plan.width), customWidth: '1'}, cur && cur.hidden ? {hidden: '0'} : {})); }
      if (np.size){
        let ce = cols; if (!ce){ ce = mk('cols'); ws.insertBefore(ce, sd); }
        while (ce.firstChild) ce.removeChild(ce.firstChild);
        const keys = [...np.keys()].sort((a, b) => a - b);
        for (let i = 0; i < keys.length;){
          let j = i; const sig = JSON.stringify(np.get(keys[i]));
          while (j + 1 < keys.length && keys[j + 1] === keys[j] + 1 && JSON.stringify(np.get(keys[j + 1])) === sig) j++;
          const col = mk('col'); col.setAttribute('min', keys[i]); col.setAttribute('max', keys[j]);
          for (const [k, v] of Object.entries(np.get(keys[i]))) col.setAttribute(k, v);
          ce.appendChild(col); i = j + 1;
        }
      }
      changed = true;
    }
    if (changed) out.set(path, ser(doc));
    // tables on this sheet: their formulas, and for the moved sheet their place and columns
    const shRels = await relMap(text, path);
    for (const tp of all(ws, 'tablePart')){
      const rel = shRels.get(tp.getAttributeNS(NS_R, 'id') || tp.getAttribute('r:id')); if (!rel) continue;
      const tdoc = parse(await text(rel.target)), te = tdoc.documentElement;
      let tch = false;
      for (const n of ['calculatedColumnFormula', 'totalsRowFormula']) for (const el of all(te, n)) if (reText(el, own)) tch = true;
      if (isT){ moveTable(tdoc, mv, plan, warnings); tch = true; }
      if (tch) out.set(rel.target, ser(tdoc));
    }
    if (isT){
      for (const rel of shRels.values()){
        if (/\/drawing$/.test(rel.type)){       // pictures and charts placed on the sheet: anchors are 0-based column numbers
          const d = parse(await text(rel.target)); let dch = false;
          for (const tag of ['from', 'to']) for (const el of all(d, tag)){ const c = kid(el, 'col'); if (!c) continue; const n = mv.pos(+c.textContent + 1) - 1; if (n !== +c.textContent){ c.textContent = n; dch = true; } }
          if (dch) out.set(rel.target, ser(d));
        } else if (/\/(comments|threadedComment)$/.test(rel.type)){
          const d = parse(await text(rel.target)); let dch = false;
          for (const tag of ['comment', 'threadedComment']) for (const el of all(d, tag)) if (el.getAttribute('ref')){ el.setAttribute('ref', mapArea(el.getAttribute('ref'), mv)); dch = true; }
          if (dch) out.set(rel.target, ser(d));
        } else if (/\/vmlDrawing$/.test(rel.type)){     // old-style comment boxes (VML is not always well-formed XML)
          const t = await text(rel.target); if (!t) continue;
          const nt = t.replace(/(<(?:[\w.-]+:)?Column>\s*)(\d+)(\s*<\/(?:[\w.-]+:)?Column>)/g, (m, a, n, b) => a + (mv.pos(+n + 1) - 1) + b)
                      .replace(/(<(?:[\w.-]+:)?Anchor>\s*)(\d+)(\s*,[^,]*,[^,]*,[^,]*,\s*)(\d+)/g, (m, a, l, mid, r) => a + (mv.pos(+l + 1) - 1) + mid + (mv.pos(+r + 1) - 1));
          if (nt !== t) out.set(rel.target, nt);
        }
      }
    }
  }
  // charts anywhere in the workbook
  for (const name of zip.names){
    if (!/^xl\/charts\/chart[^/]*\.xml$/i.test(name)) continue;
    const d = parse(await text(name)); let ch = false;
    for (const f of all(d, 'f')) if (reText(f, null)) ch = true;
    if (ch) out.set(name, ser(d));
  }
  // pivot tables built from the moved sheet
  for (const name of zip.names){
    if (!/pivotCacheDefinition[^/]*\.xml$/i.test(name)) continue;
    const d = parse(await text(name)); let ch = false;
    for (const el of all(d, 'worksheetSource')) if ((el.getAttribute('sheet') || '').toLowerCase() === target.toLowerCase() && el.getAttribute('ref')){ el.setAttribute('ref', mapArea(el.getAttribute('ref'), mv)); ch = true; }
    if (ch) out.set(name, ser(d));
  }
  // defined names (print areas, named ranges)
  for (const dn of all(wb, 'definedName')){ const ls = dn.getAttribute('localSheetId'); reText(dn, ls != null ? names[+ls] || null : null); }
  if (sstDoc && sstChanged) out.set(sstRel.target, ser(sstDoc));
  // recalculate on opening; the calculation chain lists cells by address, so it goes
  let cp = kid(wb.documentElement, 'calcPr');
  if (!cp){ cp = wb.createElementNS(NS, 'calcPr'); const after = kid(wb.documentElement, 'definedNames') || kid(wb.documentElement, 'sheets'); wb.documentElement.insertBefore(cp, after ? after.nextSibling : null); }
  cp.setAttribute('fullCalcOnLoad', '1');
  out.set(wbPath, ser(wb));
  const chain = [...wbRels.entries()].find(([, r]) => /\/calcChain$/.test(r.type));
  if (chain){
    drop.add(chain[1].target);
    const rp = relsPath(wbPath), rd = parse(await zip.text(rp));
    for (const r of all(rd, 'Relationship')) if (r.getAttribute('Id') === chain[0]) r.parentNode.removeChild(r);
    out.set(rp, ser(rd));
    const ct = parse(await zip.text('[Content_Types].xml'));
    for (const o of all(ct, 'Override')) if (o.getAttribute('PartName') === '/' + chain[1].target) o.parentNode.removeChild(o);
    out.set('[Content_Types].xml', ser(ct));
  }
  const files = [];
  for (const name of zip.names){
    if (drop.has(name) || name.endsWith('/')) continue;
    files.push({name, data: out.has(name) ? out.get(name) : await zip.bytes(name)});
  }
  const blob = await ZIP.build(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  return {bytes: new Uint8Array(await blob.arrayBuffer()), warnings};
}
/** An auto-filter's range and the column numbers of its filters (counted from its first column). */
function moveFilter(af, mv){
  const a = rangesOf(af.getAttribute('ref'))[0]; if (!a) return;
  af.setAttribute('ref', mapArea(af.getAttribute('ref'), mv));
  const b = rangesOf(af.getAttribute('ref'))[0];
  for (const fc of kids(af, 'filterColumn')){ const n = mv.pos(a.c1 + (+fc.getAttribute('colId') || 0)) - b.c1; fc.setAttribute('colId', Math.max(0, n)); }
}
/** A table on the moved sheet: its columns follow their cells; the moved (or new) column joins plan.table. */
function moveTable(tdoc, mv, plan, warnings){
  const te = tdoc.documentElement, a = rangesOf(te.getAttribute('ref'))[0], tcs = kid(te, 'tableColumns'); if (!a || !tcs) return;
  const name = te.getAttribute('displayName') || te.getAttribute('name');
  const slots = kids(tcs, 'tableColumn').map((tc, k) => ({tc, c: mv.pos(a.c1 + k), from: a.c1 + k}));
  if (plan.table && plan.table === name){
    const inside = plan.from != null && plan.from >= a.c1 && plan.from <= a.c2;
    if (inside){ const s = slots.find(x => x.from === plan.from); if (s && plan.header && !plan.keepHeader) s.tc.setAttribute('name', plan.header); }
    else {
      if (slots.some(x => (x.tc.getAttribute('name') || '').toLowerCase() === String(plan.header || '').toLowerCase())) throw new Error(`table ${name} already has a column “${plan.header}”`);
      const tc = tdoc.createElementNS(NS, 'tableColumn');
      tc.setAttribute('id', Math.max(0, ...slots.map(x => +x.tc.getAttribute('id') || 0)) + 1); tc.setAttribute('name', plan.header || 'Column');
      slots.push({tc, c: plan.to, from: plan.from});
    }
  }
  slots.sort((x, y) => x.c - y.c);
  const c1 = slots[0].c, c2 = slots[slots.length - 1].c;
  if (c2 - c1 + 1 !== slots.length) throw new Error(`the move would split the Excel table ${name}`);   // the import then keeps the old layout
  for (const s of slots) tcs.appendChild(s.tc);
  tcs.setAttribute('count', slots.length);
  te.setAttribute('ref', `${addr(a.r1, c1)}:${addr(a.r2, c2)}`);
  const af = kid(te, 'autoFilter');
  if (af){
    const f = rangesOf(af.getAttribute('ref'))[0];
    if (f){ for (const fc of kids(af, 'filterColumn')){ const n = mv.pos(f.c1 + (+fc.getAttribute('colId') || 0)) - c1; fc.setAttribute('colId', Math.max(0, n)); } af.setAttribute('ref', `${addr(f.r1, c1)}:${addr(f.r2, c2)}`); }
  }
  for (const tag of ['sortState', 'sortCondition']) for (const el of all(te, tag)) if (el.getAttribute('ref')) el.setAttribute('ref', mapArea(el.getAttribute('ref'), mv));
}
return {build, relayout, colMove};
})();

<script>
/* ---- store.js ---- */
/* store.js - how a rig's workbook is kept in the shared database.
   rigs/{RIG}                      rig document: version, file, styles, tables, sheet list, headline summary
   rigs/{RIG}/parts/{ver}-s{i}     one per sheet: layout (widths, merges, charts) and its formula table
   rigs/{RIG}/parts/{ver}-s{i}-c{k} cell rows, split so no document passes ~180 KB
   rigs/{RIG}/edits/{ver}-s{i}-b{n} people's edits for rows n*100 .. n*100+99, one entry per cell */
const STORE = (function(){
'use strict';
const CHUNK = 180000;
const BLOCK = 100;
const size = o => JSON.stringify(o).length;
function newVersion(){ return 'v' + new Date().toISOString().replace(/[-:TZ.]/g, '').slice(0, 14) + Math.random().toString(36).slice(2, 6); }

/** Split a read workbook into documents. Returns {rigDoc, parts: [{id, data}]} */
function toDocs(rig, model, ver, info){
  const parts = [], sheets = [];
  model.sheets.forEach((s, i) => {
    const meta = {ver, kind: 'meta', i, name: s.name, state: s.state, maxRow: s.maxRow, maxCol: s.maxCol, colW: s.colW, rowH: s.rowH, hiddenRows: s.hiddenRows, hiddenCols: s.hiddenCols, merges: s.merges, dv: s.dv || [], freeze: s.freeze, tabColor: s.tabColor, charts: s.charts, ftab: s.ftab};
    let fchunks = 0;
    if (size(meta) > CHUNK){                        // very large formula tables go in their own documents
      meta.ftab = null;
      let cur = [], sz = 0, from = 0;
      const flush = () => { parts.push({id: `${ver}-s${i}-f${fchunks}`, data: {ver, kind: 'ftab', i, k: fchunks, from, list: cur}}); fchunks++; from += cur.length; cur = []; sz = 0; };
      for (const f of s.ftab){ const l = size(f); if (sz + l > CHUNK && cur.length) flush(); cur.push(f); sz += l; }
      if (cur.length) flush();
    }
    parts.push({id: `${ver}-s${i}`, data: meta});
    let cur = [], sz = 0, k = 0;
    const flush = () => { parts.push({id: `${ver}-s${i}-c${k}`, data: {ver, kind: 'cells', i, k, rows: cur}}); k++; cur = []; sz = 0; };
    for (const row of s.rows){ const l = size(row); if (sz + l > CHUNK && cur.length) flush(); cur.push(row); sz += l; }
    if (cur.length || !k) flush();
    sheets.push({i, name: s.name, state: s.state, chunks: k, fchunks});
  });
  const rigDoc = Object.assign({rig, ver, file: model.file, savedAt: model.savedAt, sheets, styles: model.styles, tables: model.tables, names: model.names}, info || {});
  return {rigDoc, parts};
}
/** Rebuild the workbook model from the rig document and its parts. */
function fromDocs(rigDoc, partDocs){
  const byId = new Map(partDocs.map(p => [p.kind === 'meta' ? `m${p.i}` : p.kind === 'ftab' ? `f${p.i}-${p.k}` : `c${p.i}-${p.k}`, p]));
  const sheets = rigDoc.sheets.map(s => {
    const meta = byId.get(`m${s.i}`);
    if (!meta) throw new Error(`Part of sheet "${s.name}" is missing. Try again in a moment; if it persists, import the workbook again.`);
    let ftab = meta.ftab;
    if (!ftab){ ftab = []; for (let k = 0; k < (s.fchunks || 0); k++){ const f = byId.get(`f${s.i}-${k}`); if (!f) throw new Error('Formula data missing for ' + s.name); ftab.push(...f.list); } }
    const rows = [];
    for (let k = 0; k < s.chunks; k++){ const c = byId.get(`c${s.i}-${k}`); if (!c) throw new Error(`Cells of sheet "${s.name}" are missing. Try again in a moment.`); rows.push(...c.rows); }
    return Object.assign({}, meta, {ftab, rows});
  });
  return {file: rigDoc.file, savedAt: rigDoc.savedAt, styles: rigDoc.styles || [{}], tables: rigDoc.tables || [], names: rigDoc.names || [], sheets};
}
const editDocId = (ver, si, r) => `${ver}-s${si}-b${Math.floor(r / BLOCK)}`;

/* rigs/{RIG}/src/{ver}-k{n}   the original .xlsx (base64, in chunks), so "Export workbook" can write the
   changes back into it with every formula, list, table and chart intact */
function toB64(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(b64){ const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function srcDocs(ver, bytes){
  const b64 = toB64(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes)), n = Math.max(1, Math.ceil(b64.length / CHUNK)), out = [];
  for (let k = 0; k < n; k++) out.push({id: `${ver}-k${k}`, data: {ver, k, n, b64: b64.slice(k * CHUNK, (k + 1) * CHUNK)}});
  return out;
}
/** Join the chunks again; null if any chunk is missing. */
function srcFromDocs(docs, ver){
  const list = docs.filter(d => d && d.ver === ver).sort((a, b) => a.k - b.k);
  if (!list.length || list.length !== list[0].n || list.some((d, i) => d.k !== i)) return null;
  return fromB64(list.map(d => d.b64).join(''));
}
return {newVersion, toDocs, fromDocs, editDocId, BLOCK, srcDocs, srcFromDocs};
})();

</script>
<script>
/* ---- local.js ---- */
/* local.js - this device's own copy, kept in the browser (IndexedDB), so the page works without a connection:
     docs    every document last read from the database (rig list, workbook parts, edits, original file, marks)
     outbox  cell changes made on this device that have not reached the database yet
     kv      small settings and timestamps
   If the browser cannot keep data (no IndexedDB, private mode, storage refused) every call quietly
   does nothing and the page simply works online only. */
const LOCAL = (function(){
'use strict';
const VERSION = 1;
let dbp = null, broken = false;
// one store per database the page talks to (sites on the same github.io address share browser storage)
const name = () => 'amp-offline:' + ((typeof window !== 'undefined' && window.AMP_CONFIG && window.AMP_CONFIG.url) || 'local');

function open(){
  if (dbp) return dbp;
  dbp = new Promise(res => {
    if (typeof indexedDB === 'undefined'){ broken = true; res(null); return; }
    let req;
    try { req = indexedDB.open(name(), VERSION); } catch (e){ broken = true; res(null); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('docs')) db.createObjectStore('docs', {keyPath: 'key'}).createIndex('coll', 'coll');
      if (!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox', {keyPath: 'key'}).createIndex('rig', 'rig');
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    req.onsuccess = () => { const db = req.result; db.onversionchange = () => { try { db.close(); } catch (e){} dbp = null; }; res(db); };
    req.onerror = () => { broken = true; res(null); };
    req.onblocked = () => res(null);
  });
  return dbp;
}
/** Run fn(store(s)) in one transaction; resolves with what fn returns (an IDBRequest's result, or a value). */
async function run(stores, mode, fn){
  const db = await open(); if (!db) return null;
  return new Promise(res => {
    let t, out;
    try { t = db.transaction(stores, mode); out = fn(Array.isArray(stores) ? stores.map(s => t.objectStore(s)) : t.objectStore(stores)); }
    catch (e){ console.warn('local storage', e); res(null); return; }
    t.oncomplete = () => res(out && typeof out === 'object' && 'result' in out && 'readyState' in out ? out.result : out);
    t.onerror = t.onabort = () => { console.warn('local storage', t.error); res(null); };
  });
}
const dkey = (coll, id) => coll + '\u0001' + id;

/* ---- documents ---- */
function putDocs(coll, rows){
  if (!rows || !rows.length) return Promise.resolve(null);
  return run('docs', 'readwrite', s => { for (const r of rows) s.put({key: dkey(coll, r.id), coll, id: r.id, data: r.data, rev: r.rev == null ? null : r.rev}); });
}
function delDocs(coll, ids){
  if (!ids || !ids.length) return Promise.resolve(null);
  return run('docs', 'readwrite', s => { for (const id of ids) s.delete(dkey(coll, id)); });
}
async function docsIn(coll){ const rows = await run('docs', 'readonly', s => s.index('coll').getAll(coll)); return (rows || []).map(r => ({id: r.id, data: r.data, rev: r.rev})); }
async function getDoc(coll, id){ const r = await run('docs', 'readonly', s => s.get(dkey(coll, id))); return r ? {id: r.id, data: r.data, rev: r.rev} : null; }
/** Forget a rig's parts, edits, original file and marks that belong to another workbook version. */
async function pruneRig(rig, ver){
  for (const c of ['parts', 'edits', 'src', 'marks']){
    const coll = `rigs/${rig}/${c}`;
    const old = (await docsIn(coll)).filter(r => !r.data || r.data.ver !== ver).map(r => r.id);
    if (old.length) await delDocs(coll, old);
  }
}

/* ---- changes not uploaded yet ---- */
const obKey = (rig, ver, si, r, c) => `${rig}|${ver}|${si}:${r}:${c}`;
function obPut(rec){ return run('outbox', 'readwrite', s => { s.put(rec); }); }
/** Remove an uploaded change - only if it is still the same change (a newer one for the cell stays). */
function obDel(key, at){
  return run('outbox', 'readwrite', s => {
    const g = s.get(key);
    g.onsuccess = () => { const r = g.result; if (r && (at == null || r.at === at)) s.delete(key); };
  });
}
async function obList(rig){ return (await run('outbox', 'readonly', s => s.index('rig').getAll(rig))) || []; }

/* ---- small values ---- */
async function kvGet(k){ const v = await run('kv', 'readonly', s => s.get(k)); return v === undefined ? null : v; }
function kvSet(k, v){ return run('kv', 'readwrite', s => { s.put(v, k); }); }

/** Ask the browser not to clear this site's data when space runs low (granted for installed apps). */
async function persist(){ try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) return await navigator.storage.persist(); return true; } catch (e){ return false; } }

return {open, putDocs, delDocs, docsIn, getDoc, pruneRig, obKey, obPut, obDel, obList, kvGet, kvSet, persist, get available(){ return !broken; }};
})();

</script>
<script>
/* ---- supa.js ---- */
/* supa.js - the shared database on Supabase (replaces the claude.ai "db" capability).
   Gives the page the same small surface it already used:
     db.collection(path)                      -> collection
       .doc(id).get() / .set(obj) / .update(obj) / .mergeUpsert(obj) / .delete()
       .where(field, '==' | '!=', value)      -> query (chainable)
       .get()                                 -> {docs, size, empty, docChanges(), metadata.fromCache}

    while (gi < groups.length && groups[gi].r1 <= r){ flush(); blocks.push({type: 'charts', charts: groups[gi].charts}); gi++; }
    if (ti < tables.length && tables[ti].h === r){ flush(); blocks.push({type: 'table', t: tables[ti]}); r = tables[ti].r2; ti++; continue; }

/* ============================== grid (workbook layout) ============================== */
const colPx = w => Math.max(18, Math.round((w == null ? 8.43 : w) * 7 + 5));

  while (list.length && list[list.length - 1].sp) list.pop();

  let cmax = 1;

        const o = sh.covered.get(k), or = Math.floor(o / K), oc = o % K;

      else if (typeof v === 'string' && v && !st.wr && (!st.ha || st.ha === 'left' || st.ha === 'general')){
        let j = i + 1;
        while (j < cols.length){ const kk = r * K + cols[j]; if (hasVal(V(sh, r, cols[j])) || styledAt(sh, r, cols[j]) || sh.covered.has(kk) || sh.merges.has(kk) || X.editKeys.has(sh.idx + ':' + kk)) break; j++; }

}

  if (st.sz >= 17) cls.push('fs-xl'); else if (st.sz >= 13.5) cls.push('fs-l'); else if (st.sz && st.sz <= 9) cls.push('fs-s');

/* ============================== searchable tables ============================== */
const BLANK = '__blank__';
function tableModel(sh, t){
  const colsAll = sh.visCols.filter(c => c >= t.c1 && c <= t.c2);
  const cols = colsAll.filter(c => { if (hasVal(V(sh, t.h, c))) return true; for (let r = t.r1; r <= t.r2; r++) if (hasVal(V(sh, r, c))) return true; return false; });

    return vals.sort((a, b) => a === '' ? 1 : b === '' ? -1 : a.localeCompare(b, undefined, {numeric: true}));
  });

  if (saved){ tm.q = saved.q; tm.sort = saved.sort < cols.length ? saved.sort : -1; tm.dir = saved.dir; saved.fsel.forEach((v, j) => { if (j < cols.length && v != null && filters[j] && filters[j].includes(v)) tm.fsel[j] = v; }); }

}

function renderTableShell(tm, id){

    <span class="count tnum" id="cnt-${id}"></span><span class="sp"></span>
    <button class="btn ghost" type="button" data-act="clear" hidden>Clear filters</button>
    <button class="btn" type="button" data-act="xrows" title="Download the rows you see (after search and filters) as .xlsx">${DL_ICON}Export rows (.xlsx)</button>
  </div><div class="dt-scroll"><table class="dtab${tm.insp ? ' insp' : ''}" data-si="${tm.sh.idx}"><thead><tr><th class="rn">Row</th>`;

function viewRows(tm){

    for (let j = 0; j < tm.fsel.length; j++) if (tm.fsel[j] != null && row.text[j].trim() !== tm.fsel[j]) return false;
    return !q || row.text.some(t => t.toLowerCase().includes(q));

      const v = vals[j], t = texts[j], k = tm.kinds[j], isNum = typeof v === 'number';
      const cls = [isNum && !k.date ? 'num' : k.long ? 'long' : ''];

/* ============================== charts ============================== */
const SER = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
const STC = {good: 'var(--st-good)', fair: 'var(--st-fair)', bad: 'var(--st-bad)', pending: 'var(--st-pending)'};
const fmtV = v => v == null || typeof v !== 'number' ? '–' : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-US') : FX.general(Math.round(v * 100) / 100);
function niceTicks(max, n){

  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const out = []; for (let v = 0; v <= max + step * .001; v += step) out.push(+v.toFixed(10));

}
function barPath(x, y, w, h, r, horiz){

  if (horiz) return `M${x},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 -${r},${r}h-${w - r}z`;
  return `M${x},${y + h}v-${h - r}a${r},${r} 0 0 1 ${r},-${r}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}v${h - r}z`;
}
const textW = (s, px) => String(s).length * px * .56;
function trunc(s, maxW, px){ s = String(s); if (textW(s, px) <= maxW) return s; const n = Math.max(3, Math.floor(maxW / (px * .56)) - 1); return s.slice(0, n) + '…'; }
/* a chart series reads live cells when its range is known, else the values saved in the workbook */
function liveSeries(X, spec){
  const read = ref => {
    if (!ref) return null;
    try {
      const ast = FX.parse(String(ref).replace(/^=/, ''), 1, 1);
      const v = FX.evaluate(ast, {calc: X.calc, si: 0, r: 1, c: 1, arr: true, lets: null});
      if (v instanceof FX.Ref) return X.calc.arr(v).flat().map(x => x instanceof FX.XErr ? null : x);
    } catch (e){ /* keep saved values */ }
    return null;
  };

    const cats = read(s.catRef), vals = read(s.valRef);
    const out = Object.assign({}, s);
    if (vals) out.vals = vals.map(v => typeof v === 'number' ? v : v === null || v === '' ? null : Number(v) || 0);

  })}));

    if (st.filter(Boolean).length >= Math.max(2, cats.length - 1)) return {per: cats.map((c, i) => STC[st[i] || 'pending'])};
    return {one: SER[0]};
  }

  const spec = host._spec, X = host._X; const W = Math.floor(host.clientWidth); if (!W) return;
  const groups = liveSeries(X, spec), sig = W + '|' + JSON.stringify(groups.map(g => g.series.map(s => s.vals)));
  if (host._sig === sig) return; host._sig = sig;
  const g = groups[0];
  if (!g || !arr(g.series).length){ host.innerHTML = '<p class="muted">No chart data saved in the workbook.</p>'; return; }
  if (/pie|doughnut/i.test(g.type)) return drawDonut(host, g, W);

function drawBars(host, spec, g, W){
  const series = arr(g.series).filter(s => arr(s.vals).some(v => v != null));
  if (!series.length){ host.innerHTML = '<p class="muted">No values to plot.</p>'; return; }
  const cats = arr(series[0].cats).map(c => c === '' ? '(blank)' : c);
  const stacked = /stacked/i.test(g.grouping || ''), col = chartColors(series);

  const horiz = g.dir === 'bar' || avgLen > 9 || cats.length > 9 || W < 420;

  const totals = cats.map((_, i) => stacked ? series.reduce((a, s) => a + Math.max(0, vals(s)[i] || 0), 0) : Math.max(...series.map(s => vals(s)[i] || 0)));

    const band = inner + 14, H = cats.length * band + 22, x = v => labW + (v / top) * plotW;

    svg += `<line x1="${labW}" x2="${labW}" y1="0" y2="${H - 18}" stroke="var(--border)"/>`;
    cats.forEach((c, i) => {
      const y0 = i * band + 7;
      svg += `<text x="${labW - 8}" y="${y0 + inner / 2 + 4}" text-anchor="end" font-size="${fs}" fill="var(--ink-muted)"><title>${esc(c)}</title>${esc(trunc(c, labW - 12, fs))}</text>`;
      let acc = 0;

        const v = vals(s)[i] || 0, colr = col.per ? col.per[i] : col.one || col.ser[k];
        const tip = `<b>${esc(c)}</b><br>${single ? '' : esc(s.name || 'Series ' + (k + 1)) + ': '}${fmtV(v)}`;
        if (stacked){ const w = (v / top) * plotW; if (w > 0) svg += `<rect x="${x(acc) + (acc ? 1 : 0)}" y="${y0}" width="${Math.max(0, w - (acc ? 2 : 1))}" height="${bh}" fill="${colr}" data-tip="${esc(tip)}"/>`; acc += v; }

          if (single) svg += `<text x="${labW + w + 6}" y="${y + bh / 2 + 4}" font-size="11" fill="var(--ink)" class="tnum" pointer-events="none">${fmtV(v)}</text>`;
        }

    });

  } else {

function sysModel(X){
  const sh = sheetBy(X, /system\s*breakdown/i); if (!sh) return null;
  const hdr = findCells(sh, /^system$/i).find(x => { for (let c = x.c + 1; c <= sh.stored.maxCol + 30; c++){ const v = V(sh, x.r, c); if (hasVal(v) && /equipment/i.test(String(v))) return true; } return false; });
  if (!hdr) return null;
  const map = {}, freq = [];
  for (let c = hdr.c + 1; c <= Math.max(sh.stored.maxCol, hdr.c + 30); c++){
    const v = V(sh, hdr.r, c); if (!hasVal(v)) continue;
    const L = String(v).trim(), set = k => { if (!(k in map)) map[k] = c; };
    if (/equipment\s*\(nos\)|^equipment$|^total equipment/i.test(L)) set('total');
    else if (/^completed$|yard pm (done|completed)/i.test(L)) set('pmDone');
    else if (/^good$/i.test(L)) set('good'); else if (/^fair$/i.test(L)) set('fair'); else if (/^unacceptable$/i.test(L)) set('unacc');
    else if (/po (completed|inspected)/i.test(L)) set('poDone'); else if (/po pending/i.test(L)) set('poPend');
    else if (/^(weekly|fortnightly|monthly|quarterly|half[- ]?yearly|yearly|annual|vendor)$/i.test(L)) freq.push({label: L, c});
    else if (/abs sign/i.test(L)) set('abs'); else if (/running/i.test(L)) set('running'); else if (/manual pres/i.test(L)) set('manual'); else if (/faulty/i.test(L)) set('faulty');
    else if (/^tested$/i.test(L)) set('irTested'); else if (/^acceptable$/i.test(L)) set('irOk'); else if (/^monitor$/i.test(L)) set('irMon'); else if (/^action/i.test(L)) set('irAct'); else if (/lowest/i.test(L)) set('irLow');
  }
  const num = (r, c) => { if (c == null) return null; const v = V(sh, r, c); if (!hasVal(v)) return null; return typeof v === 'number' ? v : isNaN(+v) ? null : +v; };
  const rows = []; let total = null;
  for (let r = hdr.r + 1; r <= hdr.r + 60; r++){
    const nc = V(sh, r, hdr.c); if (!hasVal(nc)) break;
    const rec = {name: String(nc).trim()};
    for (const k in map) rec[k] = num(r, map[k]);
    rec.freq = freq.map(f => ({label: f.label, n: num(r, f.c) || 0}));
    if (/^total$/i.test(rec.name)){ total = rec; break; }
    rows.push(rec);
  }
  if (!total){ total = {name: 'Total', freq: freq.map((f, i) => ({label: f.label, n: rows.reduce((a, x) => a + (x.freq[i].n || 0), 0)}))}; for (const k in map) total[k] = rows.reduce((a, x) => a + (x[k] || 0), 0); }
  const labels = []; for (let c = 1; c <= sh.stored.maxCol; c++){ const v = V(sh, hdr.r - 1, c); if (typeof v === 'string' && v.trim()) labels.push(v.trim()); }
  return {rows, total, map, labels};
}
function headerCols(sh, r, rules){

const dv = (sh, r, key, rec, cols) => cols[key] ? fmtValue(rec[key], styleOf(sh, r, cols[key])) : '';
function obsModel(X){

function irModel(X, sys){

  if (sh){

    if (h){
      const cols = headerCols(sh, h.r, {eq: /equipment/i, val: /megg?ar value|megger value|mΩ|reading/i, status: /review status/i, comment: /comment/i});

function kpi(label, value, sub, meter, dot){

function renderSheet(X, sh, host){

    <button class="btn" type="button" data-xsheet>${DL_ICON}Export this sheet (.xlsx)</button></div><div class="stack">`;
  if (insp) h += inspBar(X);
  const charts = [], tables = [];
  blocks.forEach(b => {
    if (b.type === 'grid') h += renderGrid(sh, b.rows);
    else if (b.type === 'charts'){ h += `<div class="charts">${b.charts.map(chartCard).join('')}</div>`; charts.push(...b.charts); }
    else { const id = `t${sh.idx}_${tables.length}`; const tm = tableModel(sh, b.t); if (insp && b.t === insp.t) tm.insp = insp; tables.push([tm, id]); h += renderTableShell(tm, id); }
  });
  if (!blocks.length) h += `<div class="xwrap"><table class="xg" data-si="${sh.idx}"><tbody><tr><td data-r="1" data-c="1" style="min-width:120px">&nbsp;</td></tr></tbody></table></div><p class="muted">This sheet is empty. Select the cell above and type to start it.</p>`;

  tables.forEach(([tm, id]) => wireTable(tm, id));

  markSelection();
}

const HDR = {
  status: /^po\s*eq\.?\s*condition\s*status$|^(po\s*)?(eq(uipment)?\s*)?condition(\s*status)?$/i,
  date: /^(po\s*)?(date\s*of\s*(po\s*)?inspection|inspection\s*date)$/i,
  po: /^po\s*inspection\s*status$/i,
  ymd: /^yard\s*maint(enance)?\.?\s*date$/i,
  pm: /^yard\s*(pm\s*)?status$/i,
  name: /^equipment(\s*name)?$/i,
  sn: /^yard\s*s\.?\s*n\.?$/i,
  cat: /^amp\s*category$/i,
  remarks: /^remarks?$/i
};
const YMD_HEADER = 'Yard Maintenance Date';
const CONDITIONS = [['Good', 'good'], ['Fair', 'fair'], ['Unacceptable', 'bad'], ['No condition rating', 'pending']];
const DONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const normH = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
/** The Equipment Breakdown table and where its inspection columns are (found by header text, so column moves are fine). */
function inspModel(sh, blocks){
  if (!/equipment\s*breakdown/i.test(sh.name)) return null;
  for (const b of blocks){
    if (b.type !== 'table') continue;
    const t = b.t, cols = {};
    for (let c = t.c1; c <= t.c2; c++){ const h = normH(V(sh, t.h, c)); if (!h) continue; for (const k in HDR) if (!(k in cols) && HDR[k].test(h)){ cols[k] = c; break; } }
    if (!cols.status) continue;
    const kind = new Map([[cols.status, 'status']]);
    if (cols.date) kind.set(cols.date, 'date');
    if (cols.ymd) kind.set(cols.ymd, 'ymd');
    if (cols.po) kind.set(cols.po, 'po');
    if (cols.pm) kind.set(cols.pm, 'pm');
    return {t, cols, kind};
  }
  return null;
}
function itemInfo(sh, insp, r){
  const g = k => insp.cols[k] ? normH(fmtValue(V(sh, r, insp.cols[k]), styleOf(sh, r, insp.cols[k]))) : '';
  return {name: g('name') || `Row ${r}`, sn: g('sn'), cat: g('cat')};
}
const itemLine = i => `<p class="item"><b>${esc(i.name)}</b><span class="muted">${[i.sn ? 'Yard SN ' + i.sn : '', i.cat].filter(Boolean).map(esc).join(' · ')}</span></p>`;
function todaySerial(){ const d = new Date(); return FX.dateToSerial(d.getFullYear(), d.getMonth(), d.getDate()); }
const serialToIso = v => FX.serialToDate(v).toISOString().slice(0, 10);
function isoToSerial(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '')); return m ? FX.dateToSerial(+m[1], +m[2] - 1, +m[3]) : null; }
const dateText = v => FX.fmtNum(v, 'dd-mmm-yyyy');
const fmtWhen = t => new Date(t).toLocaleString('en-GB', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'});
const fmtLong = t => new Date(t).toLocaleString('en-GB', {day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'});
/** Put a value in a cell the way typing it would (a value equal to the workbook's own counts as "no change"). */
function setCell(X, si, r, c, v){
  const sh = X.sheets[si], key = si + ':' + (r * K + c), cell = sh.rt.cells.get(r * K + c), ex = X.edits.get(key);
  let entry;
  if (cell && cell.fi == null && sameVal(cell.v, v)) entry = {k: 'r'};
  else if (!cell && v == null) entry = {k: 'r'};
  else entry = {k: 'v', v: v == null ? null : v};
  if (entry.k === 'r' && (!ex || ex.k === 'r')) return false;
  if (ex && ex.k === 'v' && entry.k === 'v' && sameVal(ex.v, entry.v) && (ex.v == null) === (entry.v == null)) return false;
  applyLocalEdit(X, si, r, c, entry);

}

const TAP_HINT = {status: 'Rate', date: 'Set date', ymd: 'Set date', po: 'Set', pm: 'Set'};
const PICKER_ONLY = new Set(['status', 'po', 'pm']);
function inSqref(sqref, r, c){
  return String(sqref || '').trim().split(/\s+/).some(p => {
    const [a, b] = p.split(':'), x = /^\$?([A-Za-z]+)\$?(\d+)$/.exec(a), y = /^\$?([A-Za-z]+)\$?(\d+)$/.exec(b || a);
    if (!x || !y) return false;
    const c1 = FX.colNum(x[1]), c2 = FX.colNum(y[1]);
    return r >= Math.min(+x[2], +y[2]) && r <= Math.max(+x[2], +y[2]) && c >= Math.min(c1, c2) && c <= Math.max(c1, c2);
  });
}
/** The words a status column offers: those of its own Excel drop-down list, else Completed / Not Completed. */
function statusChoices(sh, r, c){
  const items = [];
  for (const d of sh.dv || []) if (inSqref(d.sqref, r, c)) for (const it of arr(d.items)) { const w = String(it).trim(); if (w && !items.some(x => x.toLowerCase() === w.toLowerCase())) items.push(w); }
  if (!items.length){
    items.push('Completed', 'Not Completed');
    for (let rr = 1; rr <= (sh.maxRow || 0) && items.length < 6; rr++){ const v = V(sh, rr, c); if (typeof v !== 'string') continue; const w = v.trim(); if (w && w.length <= 24 && statusOf(w) && !items.some(x => x.toLowerCase() === w.toLowerCase())) items.push(w); }
  }
  const rank = w => { const i = ['completed', 'not completed', 'pending'].indexOf(w.toLowerCase()); return i < 0 ? 3 : i; };
  return items.map((w, i) => [w, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]);
}

/* ============================== Today's Work Completed: upload, record, two Excel files ============================== */
const stamp = t => { const d = new Date(t), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; };

/** Every cell changed online, as it stands now (kept with each completion: the next change list starts from it). */
function editsSnapshot(X, edits){ const o = {}; for (const [key, e] of edits || X.edits) if (e.k !== 'r') o[key] = e.k === 'f' ? {k: 'f', f: e.f} : {k: 'v', v: e.v === undefined ? null : e.v}; return o; }
const sameEntry = (a, b) => (!a && !b) || (!!a && !!b && a.k === b.k && (a.k === 'f' ? a.f === b.f : sameVal(a.v, b.v) && (a.v == null) === (b.v == null)));

  const rows = [];
  for (const key of keys){
    const [si, k] = key.split(':').map(Number), sh = X.sheets[si]; if (!sh) continue;

    if (sameEntry(was, now)) continue;

  }

}
function entryText(sh, r, c, entry){

  if (!entry){ if (!cell) return ''; if (cell.fi != null) return '=' + FX.pretty(formulaText(sh, r, c)); return fmtValue(cell.v && typeof cell.v === 'object' ? FX.errOf(cell.v.e) : cell.v, st); }

/** Column header, Yard SN and equipment name for a changed cell (when it sits in a list with those columns). */

  const t = cache.get(sh.idx).find(x => row.r > x.h && row.r <= x.r2 + 1 && row.c >= x.c1 && row.c <= x.c2);
  if (!t) return {field: addr(row.r, row.c), sn: '', name: ''};
  const find = re => { for (let c = t.c1; c <= t.c2; c++) if (re.test(normH(V(sh, t.h, c)))) return c; return null; };
  const cs = find(HDR.sn), cn = find(HDR.name) || find(/equipment/i);

}
function changeSpec(X, rows, mark, at, by){
  const cells = [], put = (r, c, v, st) => cells.push([r, c, v, st || null]);
  const lab = {fc: '5B6472'}, bold = {b: 1}, base = {bd: 'blrt', bc: 'D9DEE5', va: 'top'};
  put(1, 1, `${X.rig} – changes for double-check`, {b: 1, sz: 15, fc: '1E2761'});
  put(2, 1, 'From', lab); put(2, 2, mark ? `${fmtLong(mark.at)} (last completion${mark.by ? ' by ' + mark.by : ''})` : `the import of ${X.doc.file || 'the workbook'}${X.doc.importedAt ? ' on ' + fmtLong(X.doc.importedAt) : ''}`, bold);
  put(3, 1, 'To', lab); put(3, 2, `${fmtLong(at)}${by ? ' (completed by ' + by + ')' : ' (copy from this device, not recorded)'}`, bold);
  put(4, 1, 'Changes', lab); put(4, 2, rows.length, Object.assign({ha: 'left'}, bold));
  const R0 = 6;
  ['#', 'Sheet', 'Cell', 'Yard SN', 'Equipment', 'Field', 'Before', 'After', 'Changed by', 'Changed at'].forEach((h, j) => put(R0, j + 1, h, HEAD));
  const cache = new Map();
  const tone = v => { const s = statusOf(String(v).replace(/ \(formula\)$/, '')); return Object.assign({}, base, s ? XST[s] : {}, String(v).length > 40 ? {wr: 1} : {}); };
  // a word chosen over a formula (Yard PM Status): its other side reads as the formula's value, not the formula's text
  const formulaSide = (sh, r, c) => { const cell = sh.rt.cells.get(r * K + c); if (!cell || cell.fi == null) return null; const v = cell.v && typeof cell.v === 'object' ? FX.errOf(cell.v.e) : cell.v; return v == null || v === '' ? null : `${fmtValue(v, styleOf(sh, r, c))} (formula)`; };

    const r = R0 + 1 + i, lb = rowLabels(row, cache);

    if (!row.now && row.was && row.was.k === 'v') a = formulaSide(row.sh, row.r, row.c) || a;

    put(r, 5, lb.name, Object.assign({wr: 1}, base)); put(r, 6, lb.field, Object.assign({wr: 1}, base));
    put(r, 7, b, tone(b)); put(r, 8, a, tone(a)); put(r, 9, row.by || '', base); put(r, 10, row.at ? localSerial(row.at) : null, Object.assign({nf: 'dd-mmm-yyyy hh:mm', ha: 'left'}, base));
  });

  return {name: 'Changes', cells, colW: [10, 20, 7, 9, 38, 24, 20, 20, 14, 18], freeze: {x: 0, y: R0}, autoFilter: rows.length ? `A${R0}:J${R0 + rows.length}` : null, rowH: {[R0]: 22}};
}
/** The original .xlsx of this rig (kept on the device once fetched, so it is there offline too). */
async function srcBytes(X){
  if (X.srcBytes) return X.srcBytes;
  if (!X.doc || !X.doc.src) return null;
  const coll = `rigs/${X.rig}/src`;
  try {   // the file never changes within a version: this device's copy is used when it has one
    if (LOCAL.available){ const b = STORE.srcFromDocs((await LOCAL.docsIn(coll)).map(r => r.data), X.ver); if (b) return (X.srcBytes = b); }
    const snap = await APP.db.collection(coll).where('ver', '==', X.ver).get();
    const b = STORE.srcFromDocs(snap.docs.map(d => d.data()), X.ver); if (b) X.srcBytes = b; return b;
  } catch (e){ console.warn('original workbook', e); return null; }
}
function patchJob(X, edits){
  const writes = [], newXfs = [], dateCols = [], fixes = (X.doc && X.doc.fixes) || [];
  for (const f of fixes){
    if (f.t === 'trim') writes.push({si: f.si, r: f.r, c: f.c, hasValue: true, v: f.to});
    else if (f.t === 'col'){ writes.push({si: f.si, r: f.r, c: f.c, hasValue: true, v: f.header, s: f.hs, width: f.width}); for (const [r, s] of f.styles || []) writes.push({si: f.si, r, c: f.c, s}); }
    else if (f.t === 'colfmt') for (const [r, s] of f.styles || []) writes.push({si: f.si, r, c: f.c, s});
    else if (f.t === 'datefmt') dateCols.push({si: f.si, c: f.c, r1: f.r1, r2: f.r2, nf: f.nf});
    else if (f.t === 'xf') newXfs.push({nf: f.nf});
  }
  for (const e of (edits || X.edits).values()) if (e.k !== 'r') writes.push({si: e.si, r: e.r, c: e.c, hasValue: e.k === 'v', v: e.k === 'v' ? e.v : null, f: e.k === 'f' ? e.f : null});
  return {writes, newXfs, dateCols, tables: fixes.filter(f => f.t === 'table').map(f => ({name: f.name, ref: f.ref, col: f.col, rename: f.rename || null})),
    value: (si, r, c) => X.calc.value(si, r, c),
    cached: (si, r, c) => { const s = X.rt.sheets[si], cell = s && s.cells.get(r * K + c); return cell ? (cell.v === undefined ? null : cell.v) : undefined; }};
}
/** The latest workbook: the original file with every change written in (formulas kept), else a values-only copy. */
async function buildWorkbook(X, at, edits){
  const bytes = await srcBytes(X);
  if (bytes){
    const res = await XLSXPATCH.build(bytes, patchJob(X, edits));
    if (res.warnings.length) console.warn('export', res.warnings);
    return {blob: res.blob, name: `${X.rig}_AMP_Workbook_${stamp(at)}.xlsx`, kept: true, warnings: res.warnings};
  }
  const specs = X.sheets.filter(s => !s.state || s.state === 'visible').map(sheetSpec); specs.unshift(summarySpec(X));

}
async function buildFiles(X, rows, mark, at, by, edits){

const warnHtml = w => w && w.length ? `<p class="warn">Note about the workbook: ${w.slice(0, 3).map(esc).join('; ')}${w.length > 3 ? ` (and ${w.length - 3} more)` : ''}.</p>` : '';
function exportWorkbook(){

    const wb = await buildWorkbook(X, Date.now()); await saveFile(wb.blob, wb.name);

let completing = false;
async function completeDay(X){
  if (completing) return;
  if (!APP.canWrite){ openEditDialog(); toast('Enter your name and the PIN, then press Today\'s Work Completed again.', 5000); return; }
  completing = true;
  const dlg = dialog(`<h3>Today's Work Completed</h3><p class="muted" id="cdStep">Checking the connection…</p><div class="spinner"></div>`);
  const step = s => { const el = $('#cdStep'); if (el) el.textContent = s; };
  try {
    let probe = null; try { probe = await APP.db.collection('rigs').doc(X.rig).get(); } catch (e){ /* offline */ }
    if (!probe || probe.metadata.fromCache){ offlineFinish(dlg, X, 'offline'); return; }
    if (!probe.exists || probe.data().ver !== X.ver){ dlg.body(`<h3>Workbook was replaced</h3><p>${esc(X.rig)} was updated from a newer workbook a moment ago. The page loads it now; press Today's Work Completed again afterwards.</p><div class="dlg-actions"><span class="sp"></span><button class="btn primary" data-close>OK</button></div>`); return; }
    step('Uploading this tablet\'s changes…');
    if (!(await SYNC.flush(30000))){
      if (SYNC.paused) dlg.body(`<h3>Changes not uploaded</h3><p>The edit PIN is not accepted any more. Tap <b>Edit</b>, enter the current PIN, then press Today's Work Completed again. Nothing is lost.</p><div class="dlg-actions"><span class="sp"></span><button class="btn primary" data-close>OK</button></div>`);
      else if (SYNC.lost) dlg.body(`<h3>Changes not uploaded</h3><p>The database refused some changes. They are kept on this device. Reload the page (it tries them again), then press Today's Work Completed again.</p><div class="dlg-actions"><span class="sp"></span><button class="btn primary" data-close>OK</button></div>`);
      else offlineFinish(dlg, X, APP.db.isOnline() ? 'stuck' : 'offline');
      return;
    }
    step('Collecting everyone\'s changes…');
    let mark;
    try { await refreshEdits(X); const m = await APP.db.collection(`rigs/${X.rig}/marks`).doc(X.ver).get(); if (m.metadata.fromCache) throw Object.assign(new Error('offline'), {code: 'unavailable'}); mark = m.exists ? m.data() : null; }
    catch (e){ if (e && e.code === 'unavailable'){ offlineFinish(dlg, X, 'offline'); return; } throw e; }

    X.calc.setToday(new Date()); X.calc.recalc();
    const edits = new Map(X.edits), at = Date.now(), by = AUTH.name || null, rows = changeRows(X, mark, edits);
    step('Writing the two Excel files…');
    const files = await buildFiles(X, rows, mark, at, by, edits);
    step('Recording the completion…');
    const rec = {ver: X.ver, at, by, snap: editsSnapshot(X, edits), log: ((mark && mark.log) || []).slice(-49).concat([{at, by, n: rows.length}])};
    let recErr = null;
    try { await APP.db.collection(`rigs/${X.rig}/marks`).doc(X.ver).set(rec); X.mark = rec; }
    catch (e){ console.warn('completion', e); recErr = e; }
    showFinished(dlg, files, rows, mark, recErr);
    for (const f of files){ await saveFile(f.blob, f.name); await sleep(800); }
  } catch (e){
    console.error(e);
    dlg.body(`<h3>Could not finish</h3><p class="muted">${esc(e && e.message || e)}</p><p class="note">Nothing was lost: every change stays saved. Try again in a moment.</p><div class="dlg-actions"><span class="sp"></span><button class="btn" data-close>Close</button></div>`);

    completing = false;

  }
}
function showFinished(dlg, files, rows, mark, recErr){
  const why = !recErr ? '' : recErr.code === 'not_granted' ? 'the edit PIN was not accepted (tap Edit and enter the current PIN)' : recErr.code === 'unavailable' ? 'the connection dropped' : (recErr.message || 'of an error');
  dlg.body(`<h3>${recErr ? 'Files ready' : 'Day completed'}</h3>
    <ul class="facts-list"><li><b>${N(rows.length)}</b> change${rows.length === 1 ? '' : 's'} since ${mark ? esc(fmtLong(mark.at)) : 'the import'}</li>
      <li>Workbook: <b>${esc(files[0].name)}</b> ${files[0].kept ? '(all formulas kept)' : '(values only)'}</li>
      <li>Change list: <b>${esc(files[1].name)}</b></li></ul>
    ${recErr ? `<p class="warn">The completion could not be recorded because ${esc(why)}. The files are complete; press Today's Work Completed again so the next change list starts from here.</p>` : ''}
    ${warnHtml(files[0].warnings)}

    <div class="dlg-actions"><button class="btn" type="button" data-f="0">${DL_ICON}Workbook</button><button class="btn" type="button" data-f="1">${DL_ICON}Change list</button><span class="sp"></span><button class="btn primary" type="button" data-close>Done</button></div>`);

    : `${n ? `<b>${N(n)}</b> change${n === 1 ? ' is' : 's are'} saved on this tablet and will upload by ${its} when the connection is back.` : 'Everything is saved on this tablet.'} To finish the day, press <b>Today's Work Completed</b> again when you are online (for example on deck).`;

/* ============================== changes (edit log) ============================== */
function renderChanges(X, host){
  const list = [...X.edits.values()].sort((a, b) => (b.at || 0) - (a.at || 0));
  const ids = [...new Set(list.map(e => e.by).filter(Boolean))];
  let h = `<div class="sheet-head"><h2>Changes</h2><span class="dims">${list.filter(e => e.k !== 'r').length} cells changed since the workbook was imported</span></div>`;
  if (!list.length){ host.innerHTML = h + '<div class="card"><p class="muted" style="margin:0">No one has edited this rig yet. Select any cell on a sheet tab and type to change it. Changes save for everyone straight away and appear here.</p></div>'; return; }
  h += `<div class="dt"><div class="dt-scroll"><table class="dtab"><thead><tr><th>When</th><th>Who</th><th>Sheet</th><th>Cell</th><th>Excel value</th><th>Now</th><th></th></tr></thead><tbody>`;
  for (const e of list){
    const sh = X.sheets[e.si]; if (!sh) continue;
    const cell = sh.rt.cells.get(e.r * K + e.c), st = styleOf(sh, e.r, e.c);
    const was = cell ? (cell.fi != null ? '=' + FX.pretty(formulaText(sh, e.r, e.c)) : fmtValue(cell.v && typeof cell.v === 'object' ? FX.errOf(cell.v.e) : cell.v, st)) : '';
    const now = e.k === 'r' ? '<span class="muted">Reverted to the Excel value</span>' : e.k === 'f' ? `<code>=${esc(FX.pretty(e.f))}</code> <span class="muted">→ ${esc(disp(sh, e.r, e.c))}</span>` : esc(fmtValue(e.v, st)) || '<span class="muted">(cleared)</span>';
    h += `<tr class="${e.k === 'r' ? 'rev' : ''}"><td class="tnum" title="${esc(new Date(e.at || 0).toLocaleString('en-GB'))}">${esc(ago(e.at))}</td><td data-who="${esc(e.by || '')}">${esc(nameOf(e.by))}</td><td>${esc(sh.name)}</td>
      <td><button class="linkbtn" type="button" data-goto="${e.si}:${e.r}:${e.c}">${addr(e.r, e.c)}</button></td><td class="long">${esc(was) || '<span class="muted">(empty)</span>'}</td><td class="long">${now}</td>
      <td>${e.k !== 'r' && APP.canWrite ? `<button class="btn ghost sm" type="button" data-undo="${e.si}:${e.r}:${e.c}">Undo</button>` : ''}</td></tr>`;

function ago(t){

}
function nameOf(id){ if (!id) return 'Someone'; if (id === APP.me.id) return 'You'; return APP.names.get(id) || 'Someone'; }
async function resolveNames(ids){

/* ============================== sync with the shared database ============================== */
/* Every change is also written to this device's outbox (LOCAL) before it is sent, so nothing is lost if the
   connection is down (engine room), the page is reloaded or the tablet restarts. Without a connection the
   queue simply waits and tries again; when the connection is back it first reads what reached the database
   meanwhile, so an older change from this device never overwrites a newer one from someone else. */

    const s = paused ? [`Not uploaded: ${n ? nTxt + ' waiting' : 'waiting'} – tap Edit and enter the PIN`, 'bad']
      : !isOnline() ? (n ? (LOCAL.available ? [`Offline · ${nTxt} saved on this device`, 'off'] : [`Offline · ${nTxt} waiting – keep this page open`, 'bad']) : ['Offline · showing this device\'s copy', 'off'])

    X.editDocs.add(id);

/** Is X still the rig's current workbook version in the database? */
async function stillCurrent(X){
  const d = await APP.db.collection('rigs').doc(X.rig).get();

/** Read the rig's edits from the database now (throws 'unavailable' when only this device's copy could be read). */
async function refreshEdits(X){
  const snap = await APP.db.collection(`rigs/${X.rig}/edits`).where('ver', '==', X.ver).get();
  if (snap.metadata && snap.metadata.fromCache) throw Object.assign(new Error('No connection'), {code: 'unavailable'});

/** Bring back changes this device made earlier but could not upload yet (engine room, reload, restart). */

function pushEditsToCalc(X){

    if (e.k === 'r') continue;
    const k = e.r * K + e.c; if (!X.calc.edits[e.si]) continue;
    X.calc.edits[e.si].set(k, e.k === 'f' ? {f: e.f} : {v: e.v});

}
let recalcTimer = null;

  clearTimeout(recalcTimer);

let summaryTimer = null, summaryX = null;

/** Write the rig's headline figures now (runs 4 s after the last edit, or straight away before locking). */

/** A change of this device against the database's entry for the same cell:
    'sent' (it arrived), 'keep' (still to upload) or 'lost' (someone else changed the cell later). */
function versus(e, s){
  if (!s) return 'keep';
  if ((s.at || 0) === e.at && (s.by || null) === (e.by || null)) return 'sent';
  if ((s.at || 0) === (e.base || 0)) return 'keep';              // nobody touched it since this change was made: it stands, whatever the clocks say
  return (s.at || 0) < e.at ? 'keep' : 'lost';                    // both changed it: the later one wins
}
function onEdits(X, snap){
  if (X.hold){ X.heldSnap = snap; return; }                      // "Today's Work Completed" is writing its files from a fixed state
  const next = new Map(), ids = new Set();
  for (const d of snap.docs){
    if (!d.exists) continue; const data = d.data(); ids.add(d.id);
    for (const [key, e] of Object.entries(data.cells || {})){ const m = /^r(\d+)c(\d+)$/.exec(key); if (!m) continue; next.set(data.i + ':' + (+m[1] * K + +m[2]), {si: data.i, r: +m[1], c: +m[2], k: e.k, v: e.v === undefined ? null : e.v, f: e.f || null, by: e.by || null, at: e.at || 0}); }
  }
  X.editDocs = ids;
  X.server = new Map(next);
  const had = X.pending.size, lost = [];
  for (const [key, e] of X.pending){
    const s = next.get(key), w = versus(e, s);
    if (w === 'keep') next.set(key, e);
    else { X.pending.delete(key); if (w === 'lost'){ lost.push({mine: e, theirs: s}); LOCAL.obDel(obKeyOf(X, e.si, e.r, e.c), e.at); } }
  }
  if (X.pending.size !== had) SYNC.status();
  if (lost.length) notifyLost(X, lost);
  const sig = m => JSON.stringify([...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([k, e]) => [k, e.k, e.v, e.f, e.at]));
  if (sig(next) === sig(X.edits)) return;
  X.edits = next; pushEditsToCalc(X); recalcSoon(X);
}

async function openRig(rig){
  closeRig();
  const doc = APP.rigs.get(rig);
  const cur = APP.cur = {rig, tab: APP.route.tab, views: new Map(), unsub: []};
  renderRigShell(doc, true);
  try {
    const snap = await APP.db.collection(`rigs/${rig}/parts`).where('ver', '==', doc.ver).get();
    if (APP.cur !== cur) return;
    if (snap.metadata.fromCache && !snap.docs.length) throw Object.assign(new Error('No saved copy of this version'), {code: 'unavailable'});
    const model = STORE.fromDocs(doc, snap.docs.map(d => d.data()));
    const rt = XLSXREAD.toRuntime(model);
    if ((doc.engine || 0) < ENGINE){ try { FX.validate(rt, model.savedAt ? new Date(model.savedAt) : null); } catch (e){ console.warn(e); } }
    const X = {rig, ver: doc.ver, doc, model, rt, styles: model.styles || [{}], calc: new FX.Calc(rt), edits: new Map(), server: new Map(), pending: new Map(), editDocs: new Set(), editKeys: new Set(), tableState: new Map(), mark: null, fromCopy: !!snap.metadata.fromCache};
    X.sheets = rt.sheets.map((s, i) => makeSheet(X, model.sheets[i], s, i));

    try { onEdits(X, await APP.db.collection(`rigs/${rig}/edits`).where('ver', '==', doc.ver).get()); } catch (e){ /* they arrive with the live updates */ }
    try { const m = await APP.db.collection(`rigs/${rig}/marks`).doc(doc.ver).get(); X.mark = m.exists ? m.data() : null; } catch (e){ /* not completed yet, or no copy */ }
    if (APP.cur !== cur) return;
    await restoreOutbox(X);
    if (APP.cur !== cur) return;
    pushEditsToCalc(X);
    X.calc.recalc();
    X.sheets.forEach(extent);
    cur.X = X;
    renderRigShell(doc, false);
    cur.unsub.push(APP.db.collection(`rigs/${rig}/edits`).where('ver', '==', doc.ver).onSnapshot(s => onEdits(X, s), err => { console.warn(err); toast('Live updates paused (' + (err && err.code || 'error') + '). Reload to reconnect.', 6000); }));
    cur.unsub.push(APP.db.collection(`rigs/${rig}/marks`).where('ver', '==', doc.ver).onSnapshot(s => onMark(X, s), () => {}));
    showTab(cur.tab);
    SYNC.status();
    prepareOffline(X);
  } catch (e){
    console.error(e);
    const offline = e && e.code === 'unavailable';
    if (APP.cur === cur) $('#main').innerHTML = `<div class="card"><h3>Could not open ${esc(rig)}</h3><p class="muted">${offline ? `This device is offline and has no saved copy of ${esc(rig)} yet. Open it once while online; after that it also opens without a connection.` : esc(e && e.message || e)}</p><p><a class="btn" href="#">Back to all rigs</a></p></div>`;
  }
}

function pickWorkbook(rig){

/** Read a workbook, check its formulas, tidy it (see normalizeModel) and work out its headline figures. */
async function prepareImport(buf, fileName, onStep){
  let model = await XLSXREAD.read(buf, fileName, onStep), moved = null;

  const check = m => { const rt = XLSXREAD.toRuntime(m); return {rt, stats: FX.validate(rt, m.savedAt ? new Date(m.savedAt) : null)}; };   // against the file exactly as Excel saved it
  let {rt, stats} = check(model);
  const plan = ymdPlan(model);
  if (plan && plan.risk) moved = {t: 'note', text: `“${normH(plan.header)}” ${plan.keepHeader ? 'stays where it is' : 'goes at the end of the table'}, not next to “${plan.info.after}”: ${plan.risk.sheet}!${plan.risk.cell} picks ${plan.sheet} columns by their position (${plan.risk.fn}), so moving columns would make it show the wrong ones`};
  else if (plan){        // done in the file itself, so the page and every exported workbook have the column in its place
    if (onStep) onStep(`Placing “${normH(plan.header)}” next to “${plan.info.after}”…`);
    try {
      const res = await XLSXPATCH.relayout(new Uint8Array(buf), plan);

      // INDEX/VLOOKUP/OFFSET, COLUMN()) means the move is not safe for this workbook

      if (lost > 0) throw new Error(`${lost} formula${lost === 1 ? '' : 's'} would work out a different value`);
      model = m2; buf = nbuf; rt = c2.rt; stats = c2.stats;
      moved = Object.assign({t: 'move'}, plan.info, {header: normH(plan.header), warnings: res.warnings});

async function saveImport(rig, prep, dlg){
