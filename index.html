  APP.justImported = ver;
  const total = parts.length + src.length + 1;
  dlg.body(`<h3>Saving ${esc(rig)}</h3><p class="muted" id="impStep">Uploading 0 of ${total}…</p><div class="progress"><i id="impBar" style="width:0%"></i></div>`);
  const step = (n, msg) => { const el = $('#impStep'); if (el) el.textContent = msg || `Uploading ${n} of ${total}…`; const b = $('#impBar'); if (b) b.style.width = (n / total * 100).toFixed(1) + '%'; };
  try {
    const col = APP.db.collection(`rigs/${rig}/parts`), scol = APP.db.collection(`rigs/${rig}/src`);
    for (let i = 0; i < parts.length; i++){ await withRetry(() => col.doc(parts[i].id).set(parts[i].data)); step(i + 1); }
    for (let i = 0; i < src.length; i++){ await withRetry(() => scol.doc(src[i].id).set(src[i].data)); step(parts.length + i + 1); }   // the original file, for exports with formulas
    await withRetry(() => APP.db.collection('rigs').doc(rig).set(rigDoc));
    step(total, 'Tidying up the previous version…');
    if (prev){
      for (const c of ['parts', 'edits', 'src', 'marks']){
        try { const old = await APP.db.collection(`rigs/${rig}/${c}`).where('ver', '!=', ver).get(); for (const d of old.docs) await withRetry(() => APP.db.collection(`rigs/${rig}/${c}`).doc(d.id).delete()); } catch (e){ console.warn('cleanup', e); }
      }
    }
    dlg.close();
    toast(`${rig} is live. Everyone with this link now sees the new data.`, 4500);
    if (location.hash.slice(1).split('~')[0] !== rig){ for (let i = 0; i < 40 && !APP.rigs.has(rig); i++) await sleep(150); location.hash = rig; }

  } catch (e){
    console.error(e);

  }
}

function summarySpec(X){

function exportRowsSpec(tm){
  const rows = viewRows(tm), cells = [], X = tm.sh.X;
  tm.heads.forEach((hd, j) => cells.push([1, j + 1, hd, HEAD]));
  rows.forEach((row, i) => row.vals.forEach((v, j) => {
    const st = Object.assign({}, styleOf(tm.sh, row.r, tm.cols[j])); delete st.bg; delete st.fc; st.bd = 'blrt'; st.bc = 'D9DEE5';
    const s = typeof v === 'string' ? statusOf(v) : null; if (s) Object.assign(st, XST[s]);

    cells.push([i + 2, j + 1, v, st]);

  const colW = tm.cols.map((c, j) => { const w = tm.sh.colW[c - 1]; const guess = Math.max(tm.heads[j].length * .9 + 2, 9); return Math.min(60, Math.max(w || 0, Math.min(guess, 40))); });

const safeFile = s => String(s).trim().replace(/[^\w\-]+/g, '_').replace(/^_+|_+$/g, '');
async function saveFile(blob, name){
  if (APP.downloads){
    try { await APP.downloads.save({filename: name, data: blob}); toast(`Saved ${name}`, 3500); }
    catch (e){ if (e && e.code === 'declined') return; toast(e && e.code === 'unavailable' ? 'Downloads are not available in this view.' : 'Could not save the file (' + (e && e.code || e) + ').', 5000); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
  toast(`Saved ${name}. Check your Downloads folder.`, 4500);
}
async function runExport(label, fn){ toast(`Preparing ${label}…`); try { await fn(); } catch (e){ console.error(e); toast('Export failed: ' + (e && e.message || e), 6000); } }
function exportSheets(list, file, withSummary){
  runExport(file, async () => { const X = list[0].X; const specs = list.filter(s => !s.state || s.state === 'visible').map(sheetSpec); if (withSummary) specs.unshift(summarySpec(X)); await saveFile(await XLSXWRITE.build(specs, `${X.rig} AMP Report`), file); });
}
function exportRows(tm){
  runExport('rows', async () => { const filtered = tm.q.trim() || tm.fsel.some(v => v != null); await saveFile(await XLSXWRITE.build([exportRowsSpec(tm)], `${tm.sh.X.rig} ${tm.sh.name}`), `${tm.sh.X.rig}_${safeFile(tm.sh.name)}${filtered ? '_filtered' : ''}.xlsx`); });
}

      [d.rig, s.period || '', s.total, s.pmDone, s.total ? (s.pmDone || 0) / s.total : null, po, s.total ? po / s.total : null, s.poPend != null ? s.poPend : (s.total || 0) - po, s.good, s.fair, s.unacc, s.obsOpen, d.file]

/* ============================== small UI pieces ============================== */
let toastT;
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms || 3000); }
const dlgQueue = [];
/** Show a notice when no other dialog is open (one at a time, none replaced). */
function whenFree(fn){ if ($('#dlg').hidden) fn(); else dlgQueue.push(fn); }
function dialogClosed(){ const next = dlgQueue.shift(); if (next) setTimeout(() => whenFree(next), 150); }
function dialog(html){
  const back = $('#dlg'); const box = $('#dlgBox');
  box.innerHTML = html; back.hidden = false;
  const api = {el: box, body(h){ box.innerHTML = h; wire(); }, close(){ back.hidden = true; box.innerHTML = ''; dialogClosed(); }};
  function wire(){ box.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', api.close)); }
  wire(); return api;
}
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t){ tip.hidden = true; return; }
  tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

/* ============================== editing access (name + team PIN) ============================== */
const AUTH = {pin: null, name: '',
  key(){ return 'amp-edit:' + ((window.AMP_CONFIG && AMP_CONFIG.url) || ''); },
  load(){ try { const s = JSON.parse(localStorage.getItem(this.key()) || 'null'); if (s && typeof s === 'object'){ this.pin = typeof s.pin === 'string' && s.pin ? s.pin : null; this.name = typeof s.name === 'string' ? s.name : ''; } } catch (e){} },
  save(){ try { localStorage.setItem(this.key(), JSON.stringify({pin: this.pin, name: this.name})); } catch (e){} }
};
const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const PEN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function editButton(){
  return APP.canWrite
    ? `<button class="btn ghost" id="btnEdit" type="button" title="Stop editing on this device">${PEN_ICON}<span>Editing as <b>${esc(AUTH.name || 'you')}</b> · Lock</span></button>`
    : `<button class="btn" id="btnEdit" type="button" title="Enter the edit PIN to change this report">${LOCK_ICON}Edit</button>`;
}
function bindEditButton(){ const b = $('#btnEdit'); if (b) b.addEventListener('click', () => { if (APP.canWrite) stopEditing(); else openEditDialog(); }); }
function setEditing(on){
  APP.canWrite = APP.canAdmin = !!on;
  APP.me = {id: AUTH.name || null, name: AUTH.name || ''};
  if (on){ SYNC.resume(); LOCAL.persist(); }        // upload anything that waited for the PIN; ask the browser to keep this device's copy
  refreshChrome();
}
/** Re-draw the header, tabs and current view after the editing state changed. */
function refreshChrome(){
  const cur = APP.cur;
  if (cur && cur.X){ renderRigShell(APP.rigs.get(cur.rig) || cur.X.doc, false); showTab(cur.tab); }
  else if (!cur) renderHome();           // a rig that is still loading draws its header when it finishes
  SYNC.status(); updateFormulaBar();
}
function openEditDialog(){
  const dlg = dialog(`<h3>Edit this report</h3>
    <p class="muted">Enter your name and the team’s edit PIN. Your changes save for everyone and show your name. This device remembers them, so you normally enter them once.</p>
    <label class="fld">Your name<input id="edName" class="plain" maxlength="40" autocomplete="name" value="${esc(AUTH.name || '')}"></label>
    <label class="fld">Edit PIN<input id="edPin" class="plain" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12"></label>
    <p class="err" id="edErr" hidden></p>

  const fail = m => { err.textContent = m; err.hidden = false; go.disabled = false; };
  const submit = async () => {
    if (go.disabled) return;
    const n = name.value.trim().replace(/\s+/g, ' '), p = pin.value.trim();

    if (!p) return fail('Enter the edit PIN.');

    let s;

    catch (e){ return go.isConnected && fail(e && e.code === 'unavailable' ? 'No connection. Try again when this device is online.' : (e && e.message || String(e))); }

async function stopEditing(){
  if (SYNC.busy()){ toast(APP.db.isOnline() ? 'Some changes are still being saved. Lock again once the status shows “all changes saved”.' : 'Some changes are waiting for a connection to upload. Lock once the status shows “all changes saved”.', 5000); return; }
  if (summaryX) await flushSummary();       // the rig's headline figures are due: save them first
  AUTH.pin = null; AUTH.save(); setEditing(false); toast('Editing is locked on this device. Tap Edit to make changes again.', 3500);
}
/** A saved PIN is trusted at once (so work can start while the check runs), then confirmed. */
function verifySavedPin(){
  APP.canWrite = APP.canAdmin = true;
  APP.db.checkPin(AUTH.pin).then(s => {
    if (s === 'ok') return;
    if (s === 'locked'){ toast('Too many wrong PIN attempts were made on this report. Saving may pause for up to 10 minutes.', 7000); return; }   // temporary: keep the PIN
    AUTH.pin = null; AUTH.save(); setEditing(false);
    toast('The saved edit PIN is no longer valid. Tap Edit to enter the current one.', 7000);
  }, () => { /* offline: keep the saved PIN; a refused save locks editing later */ });
}

/* ============================== routing & boot ============================== */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [rig, tab] = h.split('~');
  APP.route = {rig: rig || null, tab: tab || 'overview'};
  if (!rig){ closeRig(); renderHome(); return; }
  if (!APP.rigsReady){ renderHome(); return; }
  if (!APP.rigs.has(rig)){ closeRig(); renderHome(`There is no rig called ${rig} here.`); return; }
  if (!APP.cur || APP.cur.rig !== rig) openRig(rig);
  else if (APP.cur.X) showTab(APP.route.tab); else APP.cur.tab = APP.route.tab;
}
function onRigs(snap){
  APP.rigs = new Map(snap.docs.filter(d => d.exists).map(d => [d.id, d.data()]));
  APP.rigsReady = true;
  const cur = APP.cur;
  if (!APP.route.rig){ renderHome(); return; }
  if (cur && cur.rig === APP.route.rig){
    const doc = APP.rigs.get(cur.rig);
    if (!doc){ closeRig(); renderHome(`${APP.route.rig} was removed.`); return; }
    if (cur.X && doc.ver !== cur.X.ver){ if (APP.justImported !== doc.ver) toast(`${cur.rig} was updated from a newer workbook. Loading it…`, 4000); openRig(cur.rig); return; }
    if (cur.X) cur.X.doc = doc;
    return;
  }
  route();
}
async function boot(){
  $('#fbInput').addEventListener('blur', () => { commitInput(); });
  $('#fbRevert').addEventListener('click', () => { if (SEL.si < 0) return; applyLocalEdit(APP.cur.X, SEL.si, SEL.r, SEL.c, {k: 'r'}); toast('Restored the Excel value', 2500); });
  renderHome();
  if (window.__AMP_DEV_DB){ APP.db = window.__AMP_DEV_DB; APP.dev = true; APP.me = {id: 'dev-' + TAB_ID, name: 'You'}; APP.canAdmin = true; }
  else if (typeof SUPA !== 'undefined' && window.AMP_CONFIG && AMP_CONFIG.url && AMP_CONFIG.key){
    AUTH.load();
    APP.db = SUPA.connect(AMP_CONFIG, {pin: () => AUTH.pin, by: () => AUTH.name || null});
    APP.db.onOnline(v => { SYNC.status(); if (v) SYNC.wake(); });
    window.addEventListener('online', () => SYNC.wake());
    APP.user = {profiles: async ids => Object.fromEntries(ids.map(id => [id, {name: String(id)}]))};   // people are identified by the name they enter

  if (!APP.db){
    $('#main').innerHTML = '<div class="card"><h3>Live data is not available here</h3><p class="muted">This page is not connected to its database: the Supabase address and key (AMP_CONFIG) are missing from the page.</p></div>';
    return;
  }

    console.warn(err);
    $('#main').innerHTML = err && err.code === 'unavailable'
      ? '<div class="card"><h3>No connection</h3><p class="muted">This device has no saved copy of the reports yet. Open this page once while online; after that it also opens without a connection.</p></div>'

  });
  window.addEventListener('hashchange', route);
  route();
}
/* "Confirm each change" comes back on whenever the page is opened again - also when an installed app
   returns from the background after a while, or the browser restores the page from its memory */
let hiddenAt = 0;
const guardOn = () => { if (APP.guard) return; APP.guard = true; if (APP.cur && APP.cur.X) refreshViews(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 10 * 60000) guardOn(); });
window.addEventListener('pageshow', e => { if (e.persisted) guardOn(); });
/* the offline copy of the page itself (sw.js next to index.html); data is kept by LOCAL */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.__AMP_NO_SW){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('offline copy of the page', e)));
  navigator.serviceWorker.addEventListener('controllerchange', () => { const X = APP.cur && APP.cur.X; if (X) offlineBadge(X); });
}
window.AMP = {APP, FX, prepareImport, buildDocs, boot, ENGINE, importFlow, SYNC, LOCAL, debug: {extent, buildBlocks, detectTables, tableModel, renderSheet, renderTableShell, paintTable, viewRows, reportModel, inspModel, changeRows, patchJob, buildWorkbook, normalizeModel, editsSnapshot, setCell}};
if (!window.__AMP_NO_BOOT) boot();
})();
