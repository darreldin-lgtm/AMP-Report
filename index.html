<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2761">
<title>Rig AMP Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF2F6; --surface-3:#E4E9F0;
  --ink:#121826; --ink-2:#2A3342; --ink-muted:#5B6472; --ink-faint:#8892A0;
  --border:#DEE3EA; --grid:#E8ECF1;
  --brand:#1E2761; --brand-ink:#1E2761; --brand-soft:#EAEDF7; --copper:#B8763A; --copper-soft:#F7EDE3;
  --head-bg:#1E2761; --on-solid:#FFFFFF;
  --good:#1F7A4D; --good-bg:#E4F3EA; --good-line:#BFE1CC; --good-solid:#1F7A4D;
  --fair:#8F5C00; --fair-bg:#FBF1DA; --fair-line:#EDD8A6; --fair-solid:#A86B00;
  --bad:#B23A2E; --bad-bg:#FBE9E6; --bad-line:#F0C4BD; --bad-solid:#B23A2E;
  --pending:#5B6472; --pending-bg:#EAEDF1; --pending-line:#D6DCE3; --neutral-solid:#3A4352; --copper-solid:#9A5B22;
  --st-good:#0ca30c; --st-fair:#fab219; --st-bad:#d03b3b; --st-pending:#C3CAD4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --shadow:0 1px 2px rgba(18,24,38,.04), 0 6px 20px -8px rgba(18,24,38,.14);
  --overlay:rgba(18,24,38,.42);
  --font-display:'Barlow Condensed',"Arial Narrow",Arial,sans-serif;
  --font-body:'IBM Plex Sans',"Segoe UI",Arial,sans-serif;
  --font-mono:'IBM Plex Mono',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0D1117; --surface:#141A23; --surface-2:#1B2330; --surface-3:#232C3B;
    --ink:#E8EBF0; --ink-2:#C9D0DA; --ink-muted:#9BA4B2; --ink-faint:#6C7684;
    --border:#2A323D; --grid:#222A35;
    --brand:#7C9BD1; --brand-ink:#9DB6E0; --brand-soft:#1C2740; --copper:#D19A5C; --copper-soft:#33251A;
    --head-bg:#26345F; --on-solid:#FFFFFF;
    --good:#4FAE79; --good-bg:#173226; --good-line:#265B41; --good-solid:#1E5E3E;
    --fair:#DDA83E; --fair-bg:#332A12; --fair-line:#5C4A1E; --fair-solid:#7A5410;
    --bad:#E2695C; --bad-bg:#3A1F1C; --bad-line:#63332C; --bad-solid:#8A2E25;
    --pending:#9BA4B2; --pending-bg:#232A34; --pending-line:#333D4A; --neutral-solid:#2E3746; --copper-solid:#7A4A1E;
    --st-pending:#3A4452;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0D1117; --surface:#141A23; --surface-2:#1B2330; --surface-3:#232C3B;
  --ink:#E8EBF0; --ink-2:#C9D0DA; --ink-muted:#9BA4B2; --ink-faint:#6C7684;
  --border:#2A323D; --grid:#222A35;
  --brand:#7C9BD1; --brand-ink:#9DB6E0; --brand-soft:#1C2740; --copper:#D19A5C; --copper-soft:#33251A;
  --head-bg:#26345F; --on-solid:#FFFFFF;
  --good:#4FAE79; --good-bg:#173226; --good-line:#265B41; --good-solid:#1E5E3E;
  --fair:#DDA83E; --fair-bg:#332A12; --fair-line:#5C4A1E; --fair-solid:#7A5410;
  --bad:#E2695C; --bad-bg:#3A1F1C; --bad-line:#63332C; --bad-solid:#8A2E25;
  --pending:#9BA4B2; --pending-bg:#232A34; --pending-line:#333D4A; --neutral-solid:#2E3746; --copper-solid:#7A4A1E;
  --st-pending:#3A4452;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.005em}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand-ink)}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
code{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px;word-break:break-word}
.wrap{max-width:1440px;margin:0 auto;padding-inline:24px}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;padding-block:20px 16px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--copper)}
.back{font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink-muted)}
.back:hover{color:var(--ink)}
.title{font-size:40px;line-height:1;margin-top:6px}
.title .rig{color:var(--brand-ink)}
.subtitle{color:var(--ink-muted);margin-top:6px;font-size:14px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:var(--ink-muted)}
.facts b{font-weight:600;color:var(--ink-2)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--head-bg);border-color:var(--head-bg);color:var(--on-solid)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn svg{width:15px;height:15px;flex:none}
.linkbtn{border:0;background:none;padding:0;color:var(--brand-ink);font-weight:600;cursor:pointer;font-family:var(--font-mono);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-muted);padding:0 4px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st-pending)}
.sync.ok::before{background:var(--st-good)}
.sync.busy::before{background:var(--st-fair)}
.sync.bad{color:var(--bad)} .sync.bad::before{background:var(--st-bad)}
.sync:empty{display:none}

/* tabs + formula bar (one sticky block) */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.tabrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.tabrow:empty{display:none}
.tab{flex:none;border:0;background:none;padding:12px 12px 10px;font-size:13px;font-weight:500;color:var(--ink-muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--copper)}
.tab.ov{font-weight:600}
.tab .n{font-family:var(--font-mono);font-size:10.5px;color:var(--copper);margin-left:6px}
.fbar{border-top:1px solid var(--border);background:var(--surface)}
.fbrow{display:flex;align-items:center;gap:8px;padding-block:7px;flex-wrap:wrap}
.fbref{font-family:var(--font-mono);font-size:12px;font-weight:600;min-width:64px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);padding:0 8px}
.fx{font-family:Georgia,serif;font-style:italic;color:var(--ink-faint);font-size:14px}
#fbInput{flex:1 1 320px;min-width:0;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:0 10px;font-size:13px}
#fbInput:focus{border-color:var(--copper);outline:none;box-shadow:0 0 0 2px var(--copper-soft)}
#fbInput[readonly]{color:var(--ink-muted)}
.fbnote{font-size:12px;color:var(--ink-muted);flex:1 1 100%}
.fbnote:empty{display:none}

main{padding-block:22px 64px}
.view[hidden]{display:none}
.sheet-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.sheet-head h2{font-size:26px;line-height:1.1}
.sheet-head .dims{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint)}
.sheet-head .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:14px}
.loading{display:flex;align-items:center;gap:12px;color:var(--ink-muted);padding:40px 4px}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--surface-3);border-top-color:var(--copper);flex:none}
@media (prefers-reduced-motion:no-preference){ .spinner{animation:spin .8s linear infinite} @keyframes spin{to{transform:rotate(360deg)}} }

/* workbook grid */
.xwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px}
table.xg{border-collapse:collapse;table-layout:fixed;font-size:12.5px;color:var(--ink)}
.xg td{padding:4px 7px;height:24px;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;position:relative}
.xg td.wr{white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word}
.xg td.bd{border-color:var(--grid)}
.xg tr.sp td{height:10px;padding:0}
.xg .b{font-weight:600}.xg .i{font-style:italic}.xg .u{text-decoration:underline}
.xg .ac{text-align:center}.xg .ar{text-align:right}.xg .vt{vertical-align:top}
.xg .num{font-variant-numeric:tabular-nums}
.xg .fs-xl{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.15;letter-spacing:.01em}
.xg .fs-l{font-size:15px;font-weight:600}
.xg .fs-s{font-size:11px}
.err{color:var(--ink-faint);font-family:var(--font-mono);font-size:11px}
.f-neutral-soft{background:var(--surface-2)} .f-neutral-solid{background:var(--neutral-solid);color:var(--on-solid)}
.f-brand-soft{background:var(--brand-soft)} .f-brand-solid{background:var(--head-bg);color:var(--on-solid)}
.f-good-soft{background:var(--good-bg)} .f-good-solid{background:var(--good-solid);color:var(--on-solid)}
.f-fair-soft{background:var(--fair-bg)} .f-fair-solid{background:var(--fair-solid);color:var(--on-solid)}
.f-bad-soft{background:var(--bad-bg)} .f-bad-solid{background:var(--bad-solid);color:var(--on-solid)}
.f-copper-soft{background:var(--copper-soft)} .f-copper-solid{background:var(--copper-solid);color:var(--on-solid)}
.xg td[class*="-solid"]{border-color:transparent}
.tc-good{color:var(--good)}.tc-fair{color:var(--fair)}.tc-bad{color:var(--bad)}.tc-brand{color:var(--brand-ink)}.tc-muted{color:var(--ink-muted)}
table.xg td[data-c], table.dtab td[data-c]{cursor:cell}
td.sel{box-shadow:inset 0 0 0 2px var(--copper)}
td.ed::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent var(--copper) transparent transparent}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:0 8px 0 7px;height:20px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid;line-height:1;white-space:nowrap;vertical-align:middle}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.good{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}
.chip.fair{color:var(--fair);background:var(--fair-bg);border-color:var(--fair-line)}
.chip.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.chip.pending{color:var(--pending);background:var(--pending-bg);border-color:var(--pending-line)}

/* searchable tables */
.dt{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint)}
.search input{width:100%;height:34px;border:1px solid var(--border);border-radius:7px;background:var(--bg);padding:0 10px 0 30px;font-size:13px}
.tbar .count{font-size:12.5px;color:var(--ink-muted)}
.tbar .sp{flex:1}
.dt-scroll{max-height:min(70vh,900px);overflow:auto}
table.dtab{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.dtab th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;vertical-align:bottom;padding:8px 8px 7px;border-bottom:1px solid var(--border);font-weight:600;color:var(--ink-2);min-width:70px}
.dtab th .hl{display:flex;align-items:flex-start;gap:4px;border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-align:left;font-size:12px;line-height:1.3;white-space:normal;max-width:260px}
.dtab th .arw{color:var(--ink-faint);font-size:10px;margin-top:2px}
.dtab th select{margin-top:5px;width:100%;min-width:80px;max-width:200px;height:26px;font-size:12px;border:1px solid var(--border);border-radius:5px;background:var(--surface);padding:0 4px}
.dtab th select.on{border-color:var(--copper);box-shadow:0 0 0 1px var(--copper)}
.dtab td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top;white-space:nowrap;position:relative}
.dtab td.long{white-space:normal;min-width:220px;max-width:420px}
.dtab td.num{text-align:right;font-variant-numeric:tabular-nums}
.dtab td.rn{color:var(--ink-faint);font-family:var(--font-mono);font-size:10.5px;text-align:right;padding-right:4px}
.dtab th.rn{min-width:40px}
.dtab tbody tr:hover td{background:var(--surface-2)}
.dtab tr.newrow td{background:transparent;color:var(--ink-faint);height:30px}
.dtab tr.newrow td.rn{color:var(--copper);font-weight:600;font-size:13px}
.dtab tr.rev td{color:var(--ink-muted)}
.empty{padding:28px;text-align:center;color:var(--ink-muted)}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.card h3{font-size:19px;line-height:1.15}
.card .note,.note{font-size:12px;color:var(--ink-muted);margin-top:2px}
.chart{margin-top:10px;min-height:60px}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font-body)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dleg{display:grid;grid-template-columns:auto 1fr auto auto;gap:5px 10px;font-size:12.5px;align-items:center;min-width:180px}
.dleg i{width:10px;height:10px;border-radius:3px}
.dleg .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.dleg .p{color:var(--ink-faint);text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:7px;padding:6px 9px;font-size:12px;max-width:280px}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;font-weight:600;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.kpi .l .dot{width:8px;height:8px;border-radius:50%}
.kpi .v{font-family:var(--font-display);font-size:38px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:20px;color:var(--ink-muted);font-weight:600;margin-left:2px}
.kpi .s{font-size:12px;color:var(--ink-muted)}
.meter{height:6px;border-radius:3px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--s1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ptitle .note{margin:0}
.sys{width:100%;border-collapse:collapse;font-size:13px}
.sys th{font-size:11.5px;font-weight:600;color:var(--ink-muted);text-align:left;padding:0 10px 8px 0;border-bottom:1px solid var(--border);white-space:nowrap}
.sys td{padding:9px 10px 9px 0;border-bottom:1px solid var(--grid);vertical-align:middle}
.sys tr.tot td{border-bottom:0;font-weight:600;border-top:1px solid var(--border)}
.sys .nm{font-weight:600;white-space:nowrap}
.sys .n{text-align:right;font-variant-numeric:tabular-nums;padding-right:18px}
.pbar{display:flex;align-items:center;gap:10px;min-width:170px}
.pbar .trk{flex:1;height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:70px}
.pbar .trk i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.pbar .t{font-size:12px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:92px}
.pbar .t b{color:var(--ink);font-weight:600}
.stackbar{display:flex;height:10px;border-radius:4px;overflow:hidden;gap:2px;min-width:120px}
.stackbar i{display:block;height:100%}
.stackbar.big{height:22px;border-radius:5px}
.cleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.cleg div{display:flex;flex-direction:column;gap:1px;padding-left:12px;border-left:3px solid var(--c)}
.cleg .k{font-size:12px;color:var(--ink-muted)}
.cleg .n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.cleg .n small{font-family:var(--font-body);font-size:12px;color:var(--ink-faint);font-weight:500;margin-left:5px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb .trk{height:12px;background:var(--surface-3);border-radius:0 4px 4px 0;overflow:hidden}
.hb .trk i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink-muted);white-space:nowrap}
.hb .v b{color:var(--ink);font-weight:600}
.olist{width:100%;border-collapse:collapse;font-size:12.5px}
.olist th{font-size:11.5px;font-weight:600;color:var(--ink-muted);text-align:left;padding:0 10px 7px 0;border-bottom:1px solid var(--border);white-space:nowrap}
.olist td{padding:8px 10px 8px 0;border-bottom:1px solid var(--grid);vertical-align:top}
.olist td.txt{min-width:240px}
.olist .id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted);white-space:nowrap}
.counts{display:flex;flex-wrap:wrap;gap:8px}

  const hid = new Set(sp.hiddenCols || []), cw = sp.colW || [];
  let cols = '';
  for (let c = 1; c <= Math.max(maxC, cw.length); c++){ const w = cw[c - 1]; if (w != null || hid.has(c)) cols += `<col min="${c}" max="${c}" width="${w != null ? w : 8.43}" customWidth="1"${hid.has(c) ? ' hidden="1"' : ''}/>`; }
  let pane = '';
  if (sp.freeze && (sp.freeze.x || sp.freeze.y)){
    const fx = sp.freeze.x || 0, fy = sp.freeze.y || 0, tl = FX.colLetter(fx + 1) + (fy + 1), pn = fx && fy ? 'bottomRight' : fy ? 'bottomLeft' : 'topRight';
    pane = `<pane${fx ? ` xSplit="${fx}"` : ''}${fy ? ` ySplit="${fy}"` : ''} topLeftCell="${tl}" activePane="${pn}" state="frozen"/><selection pane="${pn}"/>`;
  }
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`
    + (sp.tabColor ? `<sheetPr><tabColor rgb="FF${sp.tabColor}"/></sheetPr>` : '')
    + `<dimension ref="A1:${FX.colLetter(maxC)}${maxR}"/><sheetViews><sheetView workbookViewId="0"${first ? ' tabSelected="1"' : ''}${sp.noGrid ? ' showGridLines="0"' : ''}>${pane}</sheetView></sheetViews>`

    + `<sheetData>${rows}</sheetData>`

}
async function build(specs, title){
  const styles = Styles(), used = new Set();
  const names = specs.map(sp => {
    let n = String(sp.name).replace(/[\[\]:*?\/\\]/g, ' ').replace(/^'+|'+$/g, '').trim().slice(0, 31) || 'Sheet';
    const base = n; let i = 2; while (used.has(n.toLowerCase())){ const suf = ` (${i++})`; n = base.slice(0, 31 - suf.length) + suf; }
    used.add(n.toLowerCase()); return n;
  });
  const sheets = specs.map((sp, i) => sheetXml(sp, styles, i === 0));
  const iso = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const files = [
    {name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${specs.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`},
    {name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`},
    {name: 'docProps/core.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${x(title || '')}</dc:title><dc:creator>AMP live report</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${iso}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${iso}</dcterms:modified></cp:coreProperties>`},
    {name: 'docProps/app.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Microsoft Excel</Application></Properties>`}
  ];
  const defs = specs.map((sp, i) => sp.autoFilter ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${x(names[i].replace(/'/g, "''"))}'!${sp.autoFilter.replace(/([A-Z]+)(\d+)/g, '$$$1$$$2')}</definedName>` : '').join('');
  files.push({name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets>${names.map((n, i) => `<sheet name="${x(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>${defs ? `<definedNames>${defs}</definedNames>` : ''}<calcPr calcId="191029"/></workbook>`});
  files.push({name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${specs.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${specs.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`});
  sheets.forEach((s, i) => files.push({name: `xl/worksheets/sheet${i + 1}.xml`, data: s}));
  files.push({name: 'xl/styles.xml', data: styles.xml()});
  return ZIP.build(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
return {build};
})();

<script>
/* ---- store.js ---- */
/* store.js - how a rig's workbook is kept in the shared database.
   rigs/{RIG}                      rig document: version, file, styles, tables, sheet list, headline summary
   rigs/{RIG}/parts/{ver}-s{i}     one per sheet: layout (widths, merges, charts) and its formula table
   rigs/{RIG}/parts/{ver}-s{i}-c{k} cell rows, split so no document passes ~180 KB
   rigs/{RIG}/edits/{ver}-s{i}-b{n} people's edits for rows n*100 .. n*100+99, one entry per cell */
const STORE = (function(){
'use strict';
const CHUNK = 180000;
const BLOCK = 100;
const size = o => JSON.stringify(o).length;
function newVersion(){ return 'v' + new Date().toISOString().replace(/[-:TZ.]/g, '').slice(0, 14) + Math.random().toString(36).slice(2, 6); }

/** Split a read workbook into documents. Returns {rigDoc, parts: [{id, data}]} */
function toDocs(rig, model, ver, info){
  const parts = [], sheets = [];
  model.sheets.forEach((s, i) => {
    const meta = {ver, kind: 'meta', i, name: s.name, state: s.state, maxRow: s.maxRow, maxCol: s.maxCol, colW: s.colW, rowH: s.rowH, hiddenRows: s.hiddenRows, hiddenCols: s.hiddenCols, merges: s.merges, freeze: s.freeze, tabColor: s.tabColor, charts: s.charts, ftab: s.ftab};
    let fchunks = 0;
    if (size(meta) > CHUNK){                        // very large formula tables go in their own documents
      meta.ftab = null;
      let cur = [], sz = 0, from = 0;
      const flush = () => { parts.push({id: `${ver}-s${i}-f${fchunks}`, data: {ver, kind: 'ftab', i, k: fchunks, from, list: cur}}); fchunks++; from += cur.length; cur = []; sz = 0; };
      for (const f of s.ftab){ const l = size(f); if (sz + l > CHUNK && cur.length) flush(); cur.push(f); sz += l; }
      if (cur.length) flush();
    }
    parts.push({id: `${ver}-s${i}`, data: meta});
    let cur = [], sz = 0, k = 0;
    const flush = () => { parts.push({id: `${ver}-s${i}-c${k}`, data: {ver, kind: 'cells', i, k, rows: cur}}); k++; cur = []; sz = 0; };
    for (const row of s.rows){ const l = size(row); if (sz + l > CHUNK && cur.length) flush(); cur.push(row); sz += l; }
    if (cur.length || !k) flush();
    sheets.push({i, name: s.name, state: s.state, chunks: k, fchunks});
  });
  const rigDoc = Object.assign({rig, ver, file: model.file, savedAt: model.savedAt, sheets, styles: model.styles, tables: model.tables, names: model.names}, info || {});
  return {rigDoc, parts};
}
/** Rebuild the workbook model from the rig document and its parts. */
function fromDocs(rigDoc, partDocs){
  const byId = new Map(partDocs.map(p => [p.kind === 'meta' ? `m${p.i}` : p.kind === 'ftab' ? `f${p.i}-${p.k}` : `c${p.i}-${p.k}`, p]));
  const sheets = rigDoc.sheets.map(s => {
    const meta = byId.get(`m${s.i}`);
    if (!meta) throw new Error(`Part of sheet "${s.name}" is missing. Try again in a moment; if it persists, import the workbook again.`);
    let ftab = meta.ftab;
    if (!ftab){ ftab = []; for (let k = 0; k < (s.fchunks || 0); k++){ const f = byId.get(`f${s.i}-${k}`); if (!f) throw new Error('Formula data missing for ' + s.name); ftab.push(...f.list); } }
    const rows = [];
    for (let k = 0; k < s.chunks; k++){ const c = byId.get(`c${s.i}-${k}`); if (!c) throw new Error(`Cells of sheet "${s.name}" are missing. Try again in a moment.`); rows.push(...c.rows); }
    return Object.assign({}, meta, {ftab, rows});
  });
  return {file: rigDoc.file, savedAt: rigDoc.savedAt, styles: rigDoc.styles || [{}], tables: rigDoc.tables || [], names: rigDoc.names || [], sheets};
}
const editDocId = (ver, si, r) => `${ver}-s${si}-b${Math.floor(r / BLOCK)}`;
return {newVersion, toDocs, fromDocs, editDocId, BLOCK};
})();

<script>
/* ---- supa.js ---- */
/* supa.js - the shared database on Supabase (replaces the claude.ai "db" capability).
   Gives the page the same small surface it already used:
     db.collection(path)                      -> collection
       .doc(id).get() / .set(obj) / .update(obj) / .mergeUpsert(obj) / .delete()
       .where(field, '==' | '!=', value)      -> query (chainable)
       .get()                                 -> {docs, size, empty, docChanges()}
       .onSnapshot(next, error)               -> unsubscribe()   (polls; see POLL_MS)
   Reads go straight to the amp_docs table (read-only for everyone).
   Writes go through the PIN-checked functions created by supabase-setup.sql.
   Error codes match the old store: 'invalid_argument' (e.g. update of a missing
   document), 'not_granted' (wrong / missing PIN), 'unavailable' (no connection or
   timed out), plus 'locked' (too many wrong PINs were tried: saving pauses, then resumes). */
const SUPA = (function(){
'use strict';
const POLL_MS = 6000;          // how often open pages look for other people's changes
const PAGE = 1000;             // rows per read request (Supabase caps a response at 1000 rows)
const ID_BATCH = 40;           // documents fetched per request when only some changed
const READ_TIMEOUT = 20000, WRITE_TIMEOUT = 60000;   // a stalled connection counts as offline after this

class DbError extends Error { constructor(code, message){ super(message || code); this.name = 'DbError'; this.code = code; } }

function connect(cfg, auth){
  const base = String(cfg.url || '').trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, '') + '/rest/v1/';
  const key = String(cfg.key || '').trim();
  const enc = encodeURIComponent;
  const listeners = new Set();
  let timer = null;

  async function http(path, opts){
    opts = opts || {};
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), opts.method === 'POST' ? WRITE_TIMEOUT : READ_TIMEOUT) : null;
    try {
      let res;
      try {
        res = await fetch(base + path, {method: opts.method || 'GET', body: opts.body, cache: 'no-store', signal: ctl ? ctl.signal : undefined,
          headers: Object.assign({apikey: key, Accept: 'application/json'}, opts.headers || {})});
      } catch (e){ throw new DbError('unavailable', 'No connection to the database. Check the network and try again.'); }
      if (!res.ok){
        let body = null; try { body = await res.json(); } catch (e){}
        const msg = (body && (body.message || body.hint || body.error)) || ('HTTP ' + res.status);
        const code = (res.status >= 500 || res.status === 408 || res.status === 429) ? 'unavailable' : 'invalid_argument';
        throw new DbError(code, `Database error: ${msg}`);
      }
      try { return await res.json(); }
      catch (e){ throw new DbError('unavailable', 'The connection dropped while reading from the database.'); }
    } finally { if (timer) clearTimeout(timer); }
  }

  /* ---------- reads ---------- */
  function filterString(filters){
    return filters.map(([field, op, value]) => {
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(field)) throw new DbError('invalid_argument', `Unsupported field "${field}"`);
      if (op !== '==' && op !== '!=') throw new DbError('invalid_argument', `Unsupported operator "${op}"`);
      if (typeof value !== 'string' && typeof value !== 'number') throw new DbError('invalid_argument', 'Only text or number values can be compared');
      return `&data->>${field}=${op === '==' ? 'eq' : 'neq'}.${enc(String(value))}`;
    }).join('');
  }
  async function select(coll, fstr, cols){
    // pages by id (not offset), so a document added mid-read cannot shift or duplicate rows
    const out = []; let after = null;
    for (;;){
      const rows = await http(`amp_docs?select=${cols}&coll=eq.${enc(coll)}${fstr}${after == null ? '' : `&id=gt.${enc(after)}`}&order=id.asc&limit=${PAGE}`);
      out.push(...rows);
      if (rows.length < PAGE) return out;
      after = rows[rows.length - 1].id;
    }
  }
  async function selectIds(coll, ids){
    const out = [];
    const quote = s => '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    for (let i = 0; i < ids.length; i += ID_BATCH){
      const list = ids.slice(i, i + ID_BATCH).map(quote).join(',');
      out.push(...await http(`amp_docs?select=id,data,rev&coll=eq.${enc(coll)}&id=in.(${enc(list)})`));
    }
    return out;
  }
  const docSnap = (id, data) => ({id, exists: data !== undefined, data: () => data, metadata: {hasPendingWrites: false, fromCache: false}});
  const querySnap = (docs, changes) => ({docs, size: docs.length, empty: !docs.length, docChanges: () => changes || docs.map((d, i) => ({type: 'added', doc: d, oldIndex: -1, newIndex: i})), metadata: {hasPendingWrites: false, fromCache: false}});

  /* ---------- writes (PIN-checked functions) ---------- */
  function statusError(s){
    if (s === 'not_found') return new DbError('invalid_argument', 'That record does not exist.');
    if (s === 'bad_pin') return new DbError('not_granted', 'The edit PIN is not correct.');
    if (s === 'locked') return new DbError('locked', 'Too many wrong PIN attempts were made on this report, so saving is paused for up to 10 minutes.');
    if (s === 'no_pin') return new DbError('not_granted', 'No edit PIN has been set up in the database yet.');
    return new DbError('invalid_argument', `The database refused the change (${s}).`);
  }
  async function write(fn, coll, args){
    const pin = auth.pin();
    if (!pin) throw new DbError('not_granted', 'Editing is locked on this device.');   // never send a guess the server would count
    const body = Object.assign({p_pin: pin, p_coll: coll}, args);
    const status = await http('rpc/' + fn, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (status !== 'ok') throw statusError(status);
    poke(coll);
  }
  async function checkPin(pin){ return http('rpc/amp_check_pin', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({p_pin: pin})}); }

  /* ---------- live updates: poll each open query, fetch only what changed ---------- */
  function listen(coll, fstr, next, error){
    const L = {coll, fstr, next, error, revs: new Map(), docs: new Map(), first: true, dead: false, busy: false, again: false, reported: false, pokeT: null};
    listeners.add(L);
    tick(L); startTimer();
    return () => { L.dead = true; clearTimeout(L.pokeT); listeners.delete(L); };
  }
  async function tick(L){
    if (L.dead) return;
    if (L.busy){ L.again = true; return; }
    L.busy = true;
    try {
      const stamps = await select(L.coll, L.fstr, 'id,rev');
      const live = new Set(stamps.map(s => s.id));
      const changed = stamps.filter(s => L.revs.get(s.id) !== s.rev).map(s => s.id);
      const removed = [...L.docs.keys()].filter(id => !live.has(id));
      if (L.first || changed.length || removed.length){
        const changes = [];
        const fresh = changed.length ? await selectIds(L.coll, changed) : [];
        for (const r of fresh){
          const snap = docSnap(r.id, r.data);
          changes.push({type: L.docs.has(r.id) ? 'modified' : 'added', doc: snap, oldIndex: -1, newIndex: -1});
          L.docs.set(r.id, snap); L.revs.set(r.id, r.rev);
        }
        for (const id of removed){ changes.push({type: 'removed', doc: L.docs.get(id), oldIndex: -1, newIndex: -1}); L.docs.delete(id); L.revs.delete(id); }
        const docs = stamps.map(s => L.docs.get(s.id)).filter(Boolean);
        L.first = false;
        if (!L.dead){ try { L.next(querySnap(docs, changes)); } catch (x){ console.error('snapshot handler', x); } }
      }
      L.reported = false;
      setOnline(true);
    } catch (e){
      if (e && e.code === 'unavailable') setOnline(false);
      // only the first load reports an error; later hiccups retry quietly on the next poll
      if (L.first && !L.reported && L.error){ L.reported = true; try { L.error(e); } catch (x){ console.warn(x); } }
      else console.warn('poll', e);
    } finally {
      L.busy = false;
      if (L.again && !L.dead){ L.again = false; tick(L); }
    }
  }
  function tickAll(){ for (const L of listeners) tick(L); }
  function startTimer(){
    if (timer) return;
    timer = setInterval(() => { if (document.visibilityState === 'visible') tickAll(); }, POLL_MS);
  }
  function poke(coll){ for (const L of listeners) if (L.coll === coll){ clearTimeout(L.pokeT); L.pokeT = setTimeout(() => tick(L), 250); } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tickAll(); });
  window.addEventListener('online', tickAll);
  window.addEventListener('focus', tickAll);

  /* ---------- connection state (for the page's status line) ---------- */
  let online = true; const onlineFns = new Set();
  function setOnline(v){ if (v === online) return; online = v; onlineFns.forEach(f => { try { f(v); } catch (e){} }); }

  /* ---------- references ---------- */
  function checkPath(path){ if (typeof path !== 'string' || !path || /^\/|\/$|\/\//.test(path)) throw new TypeError('Bad path: ' + path); return path; }
  function docRef(coll, id){
    if (typeof id !== 'string' || !id || id.includes('/')) throw new TypeError('Bad document id: ' + id);
    return {
      id, path: coll + '/' + id,
      async get(){ const rows = await http(`amp_docs?select=id,data&coll=eq.${enc(coll)}&id=eq.${enc(id)}`); return docSnap(id, rows[0] ? rows[0].data : undefined); },
      set(data){ return write('amp_set', coll, {p_id: id, p_data: data, p_by: auth.by() || null}); },
      update(data){ return write('amp_update', coll, {p_id: id, p_data: data, p_by: auth.by() || null}); },
      /** merge into the document, creating it if it does not exist (one atomic step) */
      mergeUpsert(data){ return write('amp_merge_upsert', coll, {p_id: id, p_data: data, p_by: auth.by() || null}); },
      delete(){ return write('amp_delete', coll, {p_id: id}); },
      collection(sub){ return collection(coll + '/' + id + '/' + checkPath(sub)); }
    };
  }
  function query(coll, filters){
    return {
      where(field, op, value){ return query(coll, filters.concat([[field, op, value]])); },
      async get(){ const rows = await select(coll, filterString(filters), 'id,data'); return querySnap(rows.map(r => docSnap(r.id, r.data))); },
      onSnapshot(next, error){ let f; try { f = filterString(filters); } catch (e){ if (error) setTimeout(() => error(e)); return () => {}; } return listen(coll, f, next, error); }
    };
  }
  function collection(path){ checkPath(path); return Object.assign(query(path, []), {path, doc: id => docRef(path, id)}); }

  return {collection, doc(path){ checkPath(path); const i = path.lastIndexOf('/'); return docRef(path.slice(0, i), path.slice(i + 1)); },
    checkPin, isOnline: () => online, onOnline(fn){ onlineFns.add(fn); return () => onlineFns.delete(fn); }, refresh: tickAll};
}
return {connect, DbError};
})();

</script>
<script>

(function(){

const arr = x => x == null ? [] : Array.isArray(x) ? x : [x];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';

/* ============================== state ============================== */
const APP = {db: null, user: null, downloads: null, me: {id: null, name: ''}, canWrite: false, canAdmin: false, isOwner: false,
  rigs: new Map(), rigsReady: false, cur: null, route: {rig: null, tab: 'overview'}, names: new Map(), dev: false};

/* ============================== values & formatting ============================== */
const hasVal = v => v !== null && v !== undefined && v !== '';
const WING = {'ü': '✓', 'û': '✗', 'þ': '☑', 'ý': '☒', '¨': '☐'};
function fmtValue(v, st){
  if (v === null || v === undefined) return '';
  if (v instanceof FX.XErr) return v.e;
  if (typeof v === 'number') return FX.fmtNum(v, st && st.nf);
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  let s = String(v);
  if (st && st.fn && /wingdings/i.test(st.fn)) s = s.replace(/[üûþý¨]/g, ch => WING[ch]);

/* sheet wrapper: layout + access to live values through the rig's calculator */
function makeSheet(X, stored, rt, idx){

  for (const ref of sh.mergeRefs){
    const p = String(ref).split(':'); if (p.length < 2) continue;
    const a = cellRef(p[0]), b = cellRef(p[1]);
    sh.merges.set(a.r * K + a.c, {r1: a.r, c1: a.c, r2: b.r, c2: b.c});
    for (let r = a.r; r <= b.r; r++) for (let c = a.c; c <= b.c; c++) if (r !== a.r || c !== a.c) sh.covered.set(r * K + c, a.r * K + a.c);
  }

}
function cellRef(s){ const m = /^\$?([A-Z]+)\$?(\d+)$/.exec(s); return {c: FX.colNum(m[1]), r: +m[2]}; }
const addr = (r, c) => FX.colLetter(c) + r;
const V = (sh, r, c) => sh.X.calc.value(sh.idx, r, c);
function styleOf(sh, r, c){ const cell = sh.rt.cells.get(r * K + c); return sh.X.styles[cell ? cell.s : 0] || {}; }
const disp = (sh, r, c) => fmtValue(V(sh, r, c), styleOf(sh, r, c));
function styledAt(sh, r, c){ const st = styleOf(sh, r, c); return !!((st.bg && fillClass(st.bg)) || st.bd); }
/* current extent of a sheet: the last row/column holding a value (formulas can grow or shrink it) */

  for (const [k, v] of calc.spillVal[sh.idx]) if (hasVal(v)) see(k);
  for (const k of calc.edits[sh.idx].keys()) see(k);

  sh.visCols = []; for (let c = 1; c <= sh.maxCol; c++) if (!sh.hidC.has(c)) sh.visCols.push(c);
  return sh;
}

  return out;
}

  for (const c of sh.visCols){ const k = r * K + c; if (hasVal(V(sh, r, c)) || styledAt(sh, r, c) || sh.covered.has(k) || sh.merges.has(k)) return false; }
  return true;
}
const sheetBy = (X, re) => X.sheets.find(s => re.test(s.name));
function findCells(sh, re){
  // text cells of the sheet, indexed once per recalculation
  if (sh._txtGen !== sh.X.calc.memo){
    const list = [];
    for (const k of sh.rt.cells.keys()){ const r = Math.floor(k / K), c = k % K; const v = V(sh, r, c); if (typeof v === 'string' && v) list.push({r, c, v, t: v.trim()}); }
    list.sort((a, b) => a.r - b.r || a.c - b.c);

}
function rightOf(sh, r, c){ for (let cc = c + 1; cc <= c + 6; cc++){ const v = V(sh, r, cc); if (hasVal(v)) return {r, c: cc, v}; } return null; }

/* ============================== status words ============================== */
const ST_GOOD = /^(completed?|good|closed|done|acceptable\*?|yes|ok|pass(ed)?|✓|signed|work recorded)$/i;
const ST_FAIR = /^(fair|in[ -]?progress|monitor(ing)?|on[ -]?hold|partial(ly)?( done)?|ongoing|attention|follow[ -]?up|minor)$/i;
const ST_BAD = /^(unacceptable|open|action( required)?|faulty|not done|fail(ed)?|no access|✗|critical|major|overdue|not accessi?able|poor)$/i;
const ST_PEND = /^(pending|po pending|not started|not inspected|to be updated|for review|on loan|tbc|n\/a)$/i;
const statusCache = new Map();
function statusOf(t){
  if (t == null) return null; const s = String(t).trim();
  if (!s || s.length > 24) return null;
  if (statusCache.has(s)) return statusCache.get(s);
  const r = ST_GOOD.test(s) ? 'good' : ST_FAIR.test(s) ? 'fair' : ST_BAD.test(s) ? 'bad' : ST_PEND.test(s) ? 'pending' : null;
  statusCache.set(s, r); return r;
}
const chip = (t, s) => `<span class="chip ${s || statusOf(t) || 'pending'}">${esc(t)}</span>`;

/* ============================== colours ============================== */
function hexInfo(hex){

  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2; let h = 0, s = 0;
  if (max !== min){ const d = max - min; s = l > .5 ? d / (2 - max - min) : d / (max + min); h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  const lin = c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
  return {h, s, l, lum: .2126 * lin(r) + .7152 * lin(g) + .0722 * lin(b)};
}
const family = ({h, s}) => s < .12 ? 'neutral' : (h >= 75 && h < 170) ? 'good' : (h >= 40 && h < 75) ? 'fair' : (h >= 15 && h < 40) ? 'copper' : (h < 15 || h >= 330) ? 'bad' : 'brand';

  if (!hex) return null; const x = hexInfo(hex);
  if (x.l > .9) return null; if (x.s < .15) return x.l < .38 ? null : 'tc-muted';
  const f = family(x); return f === 'good' ? 'tc-good' : (f === 'fair' || f === 'copper') ? 'tc-fair' : f === 'bad' ? 'tc-bad' : 'tc-brand';
}

/* ============================== layout detection ============================== */
function detectTables(sh){
  const out = [], MIN = 12;
  for (let r = 1; r <= sh.maxRow; r++){
    const ne = nonEmpty(sh, r);
    if (ne.length < 3 || !ne.every(x => typeof x.v === 'string')) continue;
    let gap = false;
    for (let i = 1; i < ne.length; i++){ if (sh.visCols.filter(c => c > ne[i - 1].c && c < ne[i].c).length >= 2){ gap = true; break; } }
    if (gap) continue;
    let c1 = ne[0].c, c2 = ne[ne.length - 1].c, last = r; const firstCol = ne[0].c;
    for (let k = r + 1; k <= sh.maxRow; k++){
      const n2 = nonEmpty(sh, k); if (!n2.length) break;
      if (n2.length === 1 && typeof n2[0].v === 'string' && n2[0].c <= firstCol){ const st = styleOf(sh, k, n2[0].c); if ((st.bg && fillClass(st.bg)) || st.sz >= 12) break; }
      for (const x of n2){ if (x.c < c1) c1 = x.c; if (x.c > c2) c2 = x.c; }
      last = k;
      const fc = V(sh, k, firstCol);
      if (hasVal(fc) && /^(grand\s+)?totals?$/i.test(String(fc).trim())) break;
    }
    if (last - r >= MIN){ out.push({h: r, r1: r + 1, r2: last, c1, c2}); r = last; }
  }
  return out;
}
function chartGroups(sh){
  const cs = sh.charts.slice().sort((a, b) => a.fromR - b.fromR || a.fromC - b.fromC), groups = [];
  for (const ch of cs){ const g = groups[groups.length - 1]; if (g && ch.fromR <= g.r2){ g.charts.push(ch); g.r2 = Math.max(g.r2, ch.toR); } else groups.push({r1: ch.fromR, r2: ch.toR, charts: [ch]}); }
  return groups;
}
function buildBlocks(sh){
  const tables = detectTables(sh), groups = chartGroups(sh), blocks = []; let seg = null, gi = 0, ti = 0;
  const inChart = r => groups.some(g => r >= g.r1 && r <= g.r2);
  const flush = () => { if (seg && seg.rows.length) blocks.push(seg); seg = null; };
  for (let r = 1; r <= sh.maxRow; r++){
    while (gi < groups.length && groups[gi].r1 <= r){ flush(); blocks.push({type: 'charts', charts: groups[gi].charts}); gi++; }
    if (ti < tables.length && tables[ti].h === r){ flush(); blocks.push({type: 'table', t: tables[ti]}); r = tables[ti].r2; ti++; continue; }
    if (isEmptyRow(sh, r) && inChart(r)) continue;
    if (!seg) seg = {type: 'grid', rows: []};
    seg.rows.push(r);
  }
  flush();
  while (gi < groups.length){ blocks.push({type: 'charts', charts: groups[gi].charts}); gi++; }
  return {blocks: blocks.filter(b => b.type !== 'grid' || b.rows.some(r => !isEmptyRow(sh, r))), tables};
}

/* ============================== grid (workbook layout) ============================== */
const colPx = w => Math.max(18, Math.round((w == null ? 8.43 : w) * 7 + 5));
function renderGrid(sh, rows){
  const list = []; let prevEmpty = true;
  for (const r of rows){ if (isEmptyRow(sh, r)){ if (!prevEmpty) list.push({r, sp: true}); prevEmpty = true; } else { list.push({r}); prevEmpty = false; } }
  while (list.length && list[list.length - 1].sp) list.pop();

  let cmax = 1;
  for (const r of live) for (const c of sh.visCols){ const k = r * K + c; if (hasVal(V(sh, r, c)) || styledAt(sh, r, c)) cmax = Math.max(cmax, c); const m = sh.merges.get(k); if (m) cmax = Math.max(cmax, Math.min(m.c2, sh.maxCol)); }

  let h = `<div class="xwrap"><table class="xg" data-si="${sh.idx}"><colgroup>${cols.map(c => `<col style="width:${colPx(sh.colW[c - 1])}px">`).join('')}</colgroup><tbody>`;

    if (row.sp){ h += `<tr class="sp"><td colspan="${cols.length}"></td></tr>`; continue; }
    const r = row.r, ht = sh.rowH[r];
    h += ht && ht > 16 ? `<tr style="height:${Math.round(ht * 1.3333)}px">` : '<tr>';

      const c = cols[i], k = r * K + c;
      if (sh.covered.has(k)){
        const o = sh.covered.get(k), or = Math.floor(o / K), oc = o % K;
        if (or === r && cols.includes(oc)) continue;

        let j = i + 1;
        while (j < cols.length){ const kk = r * K + cols[j]; if (hasVal(V(sh, r, cols[j])) || styledAt(sh, r, cols[j]) || sh.covered.has(kk) || sh.merges.has(kk) || X.editKeys.has(sh.idx + ':' + kk)) break; j++; }
        cs = j - i;

function cellHtml(sh, r, c, v, st, cs, rs, merged){

  if (st.sz >= 17) cls.push('fs-xl'); else if (st.sz >= 13.5) cls.push('fs-l'); else if (st.sz && st.sz <= 9) cls.push('fs-s');

/* ============================== searchable tables ============================== */
const BLANK = '__blank__';
function tableModel(sh, t){
  const colsAll = sh.visCols.filter(c => c >= t.c1 && c <= t.c2);
  const cols = colsAll.filter(c => { if (hasVal(V(sh, t.h, c))) return true; for (let r = t.r1; r <= t.r2; r++) if (hasVal(V(sh, r, c))) return true; return false; });
  const heads = cols.map(c => { const v = V(sh, t.h, c); return hasVal(v) ? fmtValue(v, styleOf(sh, t.h, c)).replace(/\s+/g, ' ').trim() : 'Column ' + FX.colLetter(c); });
  const rows = [];
  for (let r = t.r1; r <= t.r2; r++){ const vals = cols.map(c => V(sh, r, c)); rows.push({r, vals, text: cols.map((c, j) => fmtValue(vals[j], styleOf(sh, r, c)))}); }
  const kinds = cols.map((c, j) => {
    let n = 0, num = 0, date = 0, long = 0;
    for (const row of rows){ const v = row.vals[j]; if (!hasVal(v)) continue; n++; if (typeof v === 'number'){ num++; if (FX.isDateFmt(styleOf(sh, row.r, c).nf)) date++; } else if (String(v).length > 48) long++; }
    return {num: n && num / n > .6, date: n && date / n > .6, long: n && long / n > .15};
  });
  const filters = cols.map((c, j) => {
    const set = new Set(); for (const row of rows) set.add(row.text[j].trim());
    const vals = [...set];
    if (kinds[j].long || vals.length < 2 || vals.length > 30) return null;
    if (kinds[j].num && !kinds[j].date && vals.length > 12) return null;
    return vals.sort((a, b) => a === '' ? 1 : b === '' ? -1 : a.localeCompare(b, undefined, {numeric: true}));
  });
  const key = sh.idx + ':' + t.h;
  const saved = sh.X.tableState.get(key);
  const tm = {sh, t, key, cols, heads, rows, kinds, filters, q: '', fsel: cols.map(() => null), sort: -1, dir: 1};
  if (saved){ tm.q = saved.q; tm.sort = saved.sort < cols.length ? saved.sort : -1; tm.dir = saved.dir; saved.fsel.forEach((v, j) => { if (j < cols.length && v != null && filters[j] && filters[j].includes(v)) tm.fsel[j] = v; }); }
  return tm;
}
function saveTableState(tm){ tm.sh.X.tableState.set(tm.key, {q: tm.q, fsel: tm.fsel.slice(), sort: tm.sort, dir: tm.dir}); }
function renderTableShell(tm, id){
  let h = `<div class="dt" data-tid="${id}"><div class="tbar">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q-${id}" placeholder="Search ${tm.rows.length} rows" aria-label="Search rows" value="${esc(tm.q)}"></label>
    <span class="count tnum" id="cnt-${id}"></span><span class="sp"></span>
    <button class="btn ghost" type="button" data-act="clear" hidden>Clear filters</button>
    <button class="btn" type="button" data-act="xrows" title="Download the rows you see (after search and filters) as .xlsx">${DL_ICON}Export rows (.xlsx)</button>
  </div><div class="dt-scroll"><table class="dtab" data-si="${tm.sh.idx}"><thead><tr><th class="rn">Row</th>`;
  tm.heads.forEach((hd, j) => {
    const f = tm.filters[j];
    h += `<th><button class="hl" type="button" data-sort="${j}"><span>${esc(hd)}</span><span class="arw" id="ar-${id}-${j}"></span></button>`;
    if (f) h += `<select id="f-${id}-${j}" data-f="${j}" aria-label="Filter ${esc(hd)}"${tm.fsel[j] != null ? ' class="on"' : ''}><option value="">All</option>${f.map(v => `<option value="${v === '' ? BLANK : esc(v)}"${tm.fsel[j] === v ? ' selected' : ''}>${esc(v === '' ? '(blank)' : v)}</option>`).join('')}</select>`;
    h += '</th>';
  });
  return h + `</tr></thead><tbody id="tb-${id}"></tbody></table><div class="empty" id="em-${id}" hidden>No rows match. Clear the search or filters to see everything.</div></div></div>`;
}
function viewRows(tm){
  const q = tm.q.trim().toLowerCase();
  let rows = tm.rows.filter(row => {
    for (let j = 0; j < tm.fsel.length; j++) if (tm.fsel[j] != null && row.text[j].trim() !== tm.fsel[j]) return false;
    return !q || row.text.some(t => t.toLowerCase().includes(q));
  });
  if (tm.sort >= 0){
    const j = tm.sort, d = tm.dir;
    rows = rows.slice().sort((a, b) => {
      const x = a.vals[j], y = b.vals[j], xe = !hasVal(x), ye = !hasVal(y);
      if (xe || ye) return xe === ye ? 0 : xe ? 1 : -1;
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * d;

    });

    let h = `<tr data-r="${r}"${extra || ''}><td class="rn">${extra ? '+' : r}</td>`;
    tm.cols.forEach((c, j) => {
      const v = vals[j], t = texts[j], k = tm.kinds[j], isNum = typeof v === 'number';
      const cls = [isNum && !k.date ? 'num' : k.long ? 'long' : ''];
      if (X.editKeys.has(si + ':' + (r * K + c))) cls.push('ed');
      if (v instanceof FX.XErr) cls.push('err');
      const s = !isNum ? statusOf(t) : null;
      const c2 = cls.filter(Boolean).join(' ');
      h += `<td data-r="${r}" data-c="${c}"${c2 ? ` class="${c2}"` : ''}>${s ? chip(t.trim(), s) : esc(t)}</td>`;
    });
    return h + '</tr>';
  };
  let h = '';

  const filtered = tm.q.trim() || tm.fsel.some(v => v != null);
  if (APP.canWrite && !filtered && tm.sort < 0){ const nr = tm.t.r2 + 1; h += rowHtml(nr, tm.cols.map(() => null), tm.cols.map(() => ''), ' class="newrow" title="Type in this row to add a new line to the list"'); }
  body.innerHTML = h;
  document.getElementById('em-' + id).hidden = rows.length > 0 || !filtered;
  document.getElementById('cnt-' + id).textContent = rows.length === tm.rows.length ? `${tm.rows.length} rows` : `${rows.length} of ${tm.rows.length} rows`;
  const root = document.querySelector(`.dt[data-tid="${id}"]`);
  root.querySelector('[data-act="clear"]').hidden = !filtered;
  tm.heads.forEach((_, j) => { const a = document.getElementById(`ar-${id}-${j}`); if (a) a.textContent = tm.sort === j ? (tm.dir > 0 ? '▲' : '▼') : ''; });
  markSelection();
}
function wireTable(tm, id){
  const root = document.querySelector(`.dt[data-tid="${id}"]`); let timer;
  root.querySelector('input[type=search]').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { tm.q = e.target.value; saveTableState(tm); paintTable(tm, id); }, 120); });
  root.querySelectorAll('select[data-f]').forEach(sel => sel.addEventListener('change', () => {
    const j = +sel.dataset.f; tm.fsel[j] = sel.value === '' ? null : sel.value === BLANK ? '' : sel.value; sel.classList.toggle('on', sel.value !== ''); saveTableState(tm); paintTable(tm, id);
  }));
  root.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
    const j = +b.dataset.sort;
    if (tm.sort !== j){ tm.sort = j; tm.dir = 1; } else if (tm.dir === 1) tm.dir = -1; else { tm.sort = -1; tm.dir = 1; }
    saveTableState(tm); paintTable(tm, id);
  }));
  root.querySelector('[data-act="clear"]').addEventListener('click', () => {
    tm.q = ''; tm.fsel = tm.fsel.map(() => null); root.querySelector('input[type=search]').value = '';
    root.querySelectorAll('select[data-f]').forEach(s => { s.value = ''; s.classList.remove('on'); });
    saveTableState(tm); paintTable(tm, id);
  });
  root.querySelector('[data-act="xrows"]').addEventListener('click', () => exportRows(tm));
  paintTable(tm, id);
}

/* ============================== charts ============================== */
const SER = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
const STC = {good: 'var(--st-good)', fair: 'var(--st-fair)', bad: 'var(--st-bad)', pending: 'var(--st-pending)'};
const fmtV = v => v == null || typeof v !== 'number' ? '–' : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-US') : FX.general(Math.round(v * 100) / 100);
function niceTicks(max, n){
  if (!(max > 0)) return [0, 1];

/* ============================== sync with the shared database ============================== */
const SYNC = (function(){
  const queues = new Map();     // doc id -> {busy, patch}
  let inflight = 0, failed = 0, lost = 0;
  function status(){
    const el = $('#sync'); if (!el) return;
    const offline = APP.db && APP.db.isOnline && !APP.db.isOnline();
    const s = offline ? ['Offline – reconnecting…', 'bad'] : lost ? ['Some changes were not saved – reload', 'bad'] : !APP.canWrite ? ['View only', 'ro'] : failed ? ['Not saved – retrying', 'bad'] : inflight ? ['Saving…', 'busy'] : ['Live · all changes saved', 'ok'];
    el.textContent = s[0]; el.className = 'sync ' + s[1];
  }
  async function writeDoc(X, id, si, b, patch){
    // one atomic step: creates the block's document if needed, otherwise merges these cells into it
    await APP.db.collection(`rigs/${X.rig}/edits`).doc(id).mergeUpsert({ver: X.ver, i: si, b, cells: patch});
    X.editDocs.add(id);
  }
  function write(X, e){
    const id = STORE.editDocId(X.ver, e.si, e.r), b = Math.floor(e.r / STORE.BLOCK);
    const key = `r${e.r}c${e.c}`, entry = {k: e.k, v: e.v, f: e.f, by: e.by, at: e.at};
    let q = queues.get(id); if (!q){ q = {busy: false, patch: {}}; queues.set(id, q); }
    q.patch[key] = entry;
    run(X, id, e.si, b, q);
  }
  async function run(X, id, si, b, q){
    if (q.busy) return; q.busy = true;
    while (Object.keys(q.patch).length){
      const patch = q.patch; q.patch = {};
      inflight++; status();
      let tries = 0, counted = false, pausedNoted = false;
      for (;;){
        try { await writeDoc(X, id, si, b, patch); break; }
        catch (err){
          const code = err && err.code;
          if (code === 'not_granted'){ q.patch = {}; lockEditing(X, (err && err.message) || 'The edit PIN was not accepted.'); break; }
          if (code === 'invalid_argument'){ undoCells(X, si, patch); toast(`A change could not be saved and was undone. ${(err && err.message) || ''}`, 8000); break; }
          if (!counted){ failed++; counted = true; }
          status();
          if (code === 'locked'){   // someone tried wrong PINs: keep the change and try again every minute
            if (!pausedNoted){ pausedNoted = true; toast(`${err.message} Your changes are kept and will save automatically.`, 9000); }
            await sleep(60000); continue;
          }
          tries++;
          await sleep(Math.min(15000, 1000 * Math.pow(2, tries)) + Math.random() * 500);
          if (tries > 8){ lost++; toast('Could not save a change after several tries. Check your connection and reload.', 8000); break; }
        }
      }
      if (counted) failed--;
      inflight--; status();
    }
    q.busy = false;
  }
  /** true while any change is queued, being sent, or waiting to retry */
  function busy(){ return inflight > 0 || failed > 0 || [...queues.values()].some(q => q.busy || Object.keys(q.patch).length); }
  return {write, status, busy};
})();
const TAB_ID = Math.random().toString(36).slice(2, 10);
function pushEditsToCalc(X){

    if (e.k === 'r') continue;

    X.calc.edits[e.si].set(k, e.k === 'f' ? {f: e.f} : {v: e.v});
    X.editKeys.add(key);
  }
  const b = $('#chgCount'); if (b && APP.cur && APP.cur.X === X) b.textContent = X.editKeys.size || '';
}

function recalcSoon(X, delay){

function pickWorkbook(rig){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  inp.addEventListener('change', () => { if (inp.files && inp.files[0]) importFlow(inp.files[0], rig); });
  inp.click();
}
/** Read a workbook, check its formulas and work out its headline figures. */
async function prepareImport(buf, fileName, onStep){
  const model = await XLSXREAD.read(buf, fileName, onStep);
  if (onStep) onStep('Checking every formula against the values Excel saved…');
  await sleep(30);
  const rt = XLSXREAD.toRuntime(model);
  const stats = FX.validate(rt, model.savedAt ? new Date(model.savedAt) : null);
  XLSXREAD.applyStatic(model, rt);
  const X = {styles: model.styles, calc: new FX.Calc(rt), edits: new Map(), editKeys: new Set(), tableState: new Map(), doc: {}};
  X.sheets = rt.sheets.map((s, i) => makeSheet(X, model.sheets[i], s, i)); X.calc.recalc(); X.sheets.forEach(extent);
  return {model, stats, summary: summaryOf(X)};
}
function buildDocs(rig, prep){
  const ver = STORE.newVersion();
  return Object.assign({ver}, STORE.toDocs(rig, prep.model, ver, {importedAt: Date.now(), importedBy: APP.me.id || null, engine: ENGINE, summary: prep.summary}));
}
async function importFlow(file, rigFixed){

  catch (e){ console.error(e); dlg.body(`<h3>Could not read that file</h3><p class="muted">${esc(e.message || e)}</p><div class="dlg-actions"><button class="btn" data-close>Close</button></div>`); return; }
  const {model, stats, summary} = prep;

  const existing = rigFixed ? APP.rigs.get(rigFixed) : null;
  const pctLive = stats.formulas ? Math.round(stats.live / stats.formulas * 1000) / 10 : 100;
  const renderConfirm = () => {

    return `<h3>${target ? `Replace ${esc(code)} with this workbook?` : 'Add this rig?'}</h3>
      <ul class="facts-list"><li><b>${esc(file.name)}</b>${model.savedAt ? `, saved ${esc(new Date(model.savedAt).toLocaleString('en-GB', {day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'}))}` : ''}</li>
      <li>${model.sheets.length} sheets · ${stats.formulas.toLocaleString('en-US')} formulas, ${pctLive}% recalculate live${stats.formulas - stats.live ? ` (${(stats.formulas - stats.live).toLocaleString('en-US')} keep the value Excel saved)` : ''}</li>
      ${summary.total ? `<li>${N(summary.total)} equipment items · Yard PM ${pctS(summary.pmDone || 0, summary.total)} · ${N(summary.obsOpen)} open observations</li>` : ''}</ul>
      ${rigFixed ? '' : `<label class="fld">Rig code<input id="impRig" value="${esc(code)}" maxlength="20" autocomplete="off"></label>`}
      ${target ? `<p class="warn">Everyone viewing ${esc(code)} switches to the new data. ${edits === 0 ? 'No one has changed it online since the last import.' : `${edits != null ? `The ${edits} change${edits === 1 ? '' : 's'} made online since the last import` : 'Any changes made online since the last import'} will be cleared, so export the current version first if you still need them.`}</p>` : ''}
      <div class="dlg-actions">${target && APP.cur && APP.cur.rig === code ? `<button class="btn" data-exportcur>${DL_ICON}Export current version</button>` : ''}<span class="sp"></span><button class="btn ghost" data-close>Cancel</button><button class="btn primary" data-go>${target ? 'Replace data' : 'Add rig'}</button></div>`;
  };

      const code = (rigFixed || ($('#impRig') ? $('#impRig').value : guess)).trim().toUpperCase();
      if (!/^[A-Z0-9][A-Z0-9_\-]{0,19}$/.test(code)){ toast('Use letters and numbers for the rig code, for example B370.', 4000); return; }

}
async function saveImport(rig, prep, dlg){
  const prev = APP.rigs.get(rig);
  const {ver, rigDoc, parts} = buildDocs(rig, prep);
  APP.justImported = ver;
  dlg.body(`<h3>Saving ${esc(rig)}</h3><p class="muted" id="impStep">Uploading 0 of ${parts.length + 1}…</p><div class="progress"><i id="impBar" style="width:0%"></i></div>`);
  const step = (n, msg) => { const el = $('#impStep'); if (el) el.textContent = msg || `Uploading ${n} of ${parts.length + 1}…`; const b = $('#impBar'); if (b) b.style.width = (n / (parts.length + 1) * 100).toFixed(1) + '%'; };
  try {
    const col = APP.db.collection(`rigs/${rig}/parts`);
    for (let i = 0; i < parts.length; i++){ await withRetry(() => col.doc(parts[i].id).set(parts[i].data)); step(i + 1); }
    await withRetry(() => APP.db.collection('rigs').doc(rig).set(rigDoc));
    step(parts.length + 1, 'Tidying up the previous version…');
    if (prev){
      for (const c of ['parts', 'edits']){
        try { const old = await APP.db.collection(`rigs/${rig}/${c}`).where('ver', '!=', ver).get(); for (const d of old.docs) await withRetry(() => APP.db.collection(`rigs/${rig}/${c}`).doc(d.id).delete()); } catch (e){ console.warn('cleanup', e); }
      }
    }
    dlg.close();
    toast(`${rig} is live. Everyone with this link now sees the new data.`, 4500);
    if (location.hash.slice(1).split('~')[0] !== rig){ for (let i = 0; i < 40 && !APP.rigs.has(rig); i++) await sleep(150); location.hash = rig; }
    // viewers already on this rig reload when the rig document's version changes
  } catch (e){
    console.error(e);
    dlg.body(`<h3>Could not save ${esc(rig)}</h3><p class="muted">${esc(e && (e.message || e.code) || e)}${e && e.code === 'quota_exceeded' ? ' The shared database is full; remove a rig you no longer need.' : ''}</p><div class="dlg-actions"><button class="btn" data-close>Close</button></div>`);
  }
}
async function withRetry(fn){ for (let i = 0; ; i++){ try { return await fn(); } catch (e){ if (i >= 3 || (e && ['invalid_argument', 'quota_exceeded', 'revoked', 'not_granted'].includes(e.code))) throw e; await sleep(800 * (i + 1) + Math.random() * 400); } } }

const HEAD = {b: 1, fc: 'FFFFFF', bg: '1E2761', bd: 'blrt', bc: '1E2761', va: 'center', wr: 1};
const XST = {good: {bg: 'C6EFCE', fc: '006100'}, fair: {bg: 'FFEB9C', fc: '9C5700'}, bad: {bg: 'FFC7CE', fc: '9C0006'}, pending: {bg: 'EDEDED', fc: '595959'}};
function sheetSpec(sh){
  extent(sh);
  const cells = [], seen = new Set(), X = sh.X, calc = X.calc;
  const put = (r, c) => { const k = r * K + c; if (seen.has(k)) return; seen.add(k); const cell = sh.rt.cells.get(k); const st = Object.assign({}, X.styles[cell ? cell.s : 0] || {}); cells.push([r, c, calc.value(sh.idx, r, c), st]); };
  for (const k of sh.rt.cells.keys()) put(Math.floor(k / K), k % K);
  for (const [k, v] of calc.spillVal[sh.idx]) if (hasVal(v)) put(Math.floor(k / K), k % K);
  for (const k of calc.edits[sh.idx].keys()) put(Math.floor(k / K), k % K);
  const tabs = detectTables(sh).slice().sort((a, b) => (b.r2 - b.r1) - (a.r2 - a.r1)), t = tabs[0];
  return {name: sh.name, cells, colW: sh.colW, hiddenCols: [...sh.hidC], rowH: sh.rowH, merges: sh.mergeRefs, freeze: sh.stored.freeze || (t && t.h <= 8 ? {x: 0, y: t.h} : null),

}

    .forEach(([k, v]) => { put(1, k, lab); put(3, v == null || v === '' ? '–' : v, bold); merges.push(`A${r}:B${r}`, `C${r}:F${r}`); r++; });

    const kf = [['Equipment in AMP scope', T.total, null], ['Yard PM completed', T.pmDone, T.total ? T.pmDone / T.total : null], ['PO inspected', po, T.total ? po / T.total : null], ['PO pending', T.poPend != null ? T.poPend : T.total - po, T.total ? (T.poPend != null ? T.poPend : T.total - po) / T.total : null], ['Good', T.good, insp ? T.good / insp : null], ['Fair', T.fair, insp ? T.fair / insp : null], ['Unacceptable', T.unacc, insp ? T.unacc / insp : null]];

    section('Progress by system');

function exportRowsSpec(tm){

};
const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const PEN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function editButton(){
  return APP.canWrite
    ? `<button class="btn ghost" id="btnEdit" type="button" title="Stop editing on this device">${PEN_ICON}<span>Editing as <b>${esc(AUTH.name || 'you')}</b> · Lock</span></button>`
    : `<button class="btn" id="btnEdit" type="button" title="Enter the edit PIN to change this report">${LOCK_ICON}Edit</button>`;
}
function bindEditButton(){ const b = $('#btnEdit'); if (b) b.addEventListener('click', () => { if (APP.canWrite) stopEditing(); else openEditDialog(); }); }
function setEditing(on){
  APP.canWrite = APP.canAdmin = !!on;
  APP.me = {id: AUTH.name || null, name: AUTH.name || ''};
  refreshChrome();
}
/** Re-draw the header, tabs and current view after the editing state changed. */
function refreshChrome(){
  const cur = APP.cur;
  if (cur && cur.X){ renderRigShell(APP.rigs.get(cur.rig) || cur.X.doc, false); showTab(cur.tab); }
  else if (!cur) renderHome();           // a rig that is still loading draws its header when it finishes
  SYNC.status(); updateFormulaBar();
}
function openEditDialog(){
  const dlg = dialog(`<h3>Edit this report</h3>
    <p class="muted">Enter your name and the team’s edit PIN. Your changes save for everyone and show your name. This device remembers them, so you normally enter them once.</p>
    <label class="fld">Your name<input id="edName" class="plain" maxlength="40" autocomplete="name" value="${esc(AUTH.name || '')}"></label>
    <label class="fld">Edit PIN<input id="edPin" class="plain" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12"></label>
    <p class="err" id="edErr" hidden></p>
    <div class="dlg-actions"><span class="sp"></span><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-go>Start editing</button></div>`);
  const name = $('#edName'), pin = $('#edPin'), err = $('#edErr'), go = dlg.el.querySelector('[data-go]');
  (AUTH.name ? pin : name).focus();
  const fail = m => { err.textContent = m; err.hidden = false; go.disabled = false; };
  const submit = async () => {
    if (go.disabled) return;
    const n = name.value.trim().replace(/\s+/g, ' '), p = pin.value.trim();
    if (!n) return fail('Enter your name, so others can see who changed what.');
    if (!p) return fail('Enter the edit PIN.');
    go.disabled = true; err.hidden = true;
    let s;
    try { s = await APP.db.checkPin(p); }
    catch (e){ return go.isConnected && fail(e && e.code === 'unavailable' ? 'No connection. Try again when this device is online.' : (e && e.message || String(e))); }
    if (!go.isConnected) return;            // the dialog was cancelled while the PIN was being checked
    if (s === 'ok'){ AUTH.name = n; AUTH.pin = p; AUTH.save(); dlg.close(); setEditing(true); toast(`Editing as ${n}. Changes save for everyone.`, 3500); return; }
    fail(s === 'bad_pin' ? 'That PIN is not correct.' : s === 'locked' ? 'Too many wrong PIN attempts. Editing is locked for 10 minutes.' : s === 'no_pin' ? 'No edit PIN has been set up in the database yet.' : `The PIN could not be checked (${s}).`);
  };
  go.addEventListener('click', submit);
  [name, pin].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); submit(); } }));
}
async function stopEditing(){
  if (SYNC.busy()){ toast('Some changes are still being saved. Lock again once the status shows “all changes saved”.', 5000); return; }
  if (summaryX) await flushSummary();       // the rig's headline figures are due: save them first
  AUTH.pin = null; AUTH.save(); setEditing(false); toast('Editing is locked on this device. Tap Edit to make changes again.', 3500);
}
/** A saved PIN is trusted at once (so work can start while the check runs), then confirmed. */
function verifySavedPin(){
  APP.canWrite = APP.canAdmin = true;
  APP.db.checkPin(AUTH.pin).then(s => {
    if (s === 'ok') return;
    if (s === 'locked'){ toast('Too many wrong PIN attempts were made on this report. Saving may pause for up to 10 minutes.', 7000); return; }   // temporary: keep the PIN
    AUTH.pin = null; AUTH.save(); setEditing(false);
    toast('The saved edit PIN is no longer valid. Tap Edit to enter the current one.', 7000);
  }, () => { /* offline: keep the saved PIN; a refused save locks editing later */ });
}
/** A save was refused because of the PIN: stop editing and undo what did not reach the database. */
let lockToastAt = 0;
function lockEditing(X, msg){
  const wasEditing = APP.canWrite || !!AUTH.pin;
  if (AUTH.pin){ AUTH.pin = null; AUTH.save(); }
  let undone = false;
  if (X && X.pending && X.pending.size){ X.pending.clear(); undone = true; if (X.lastSnap) onEdits(X, X.lastSnap); }
  if (wasEditing) setEditing(false);
  if ((wasEditing || undone) && Date.now() - lockToastAt > 3000){
    lockToastAt = Date.now();
    toast(`${msg} Changes that were not saved have been undone. Tap Edit to enter the PIN again.`, 8000);
  }
}

/* ============================== routing & boot ============================== */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [rig, tab] = h.split('~');
  APP.route = {rig: rig || null, tab: tab || 'overview'};
  if (!rig){ closeRig(); renderHome(); return; }
  if (!APP.rigsReady){ renderHome(); return; }
  if (!APP.rigs.has(rig)){ closeRig(); renderHome(`There is no rig called ${rig} here.`); return; }
  if (!APP.cur || APP.cur.rig !== rig) openRig(rig);
  else if (APP.cur.X) showTab(APP.route.tab); else APP.cur.tab = APP.route.tab;
}
function onRigs(snap){
  APP.rigs = new Map(snap.docs.filter(d => d.exists).map(d => [d.id, d.data()]));
  APP.rigsReady = true;
  const cur = APP.cur;
  if (!APP.route.rig){ renderHome(); return; }
  if (cur && cur.rig === APP.route.rig){
    const doc = APP.rigs.get(cur.rig);
    if (!doc){ closeRig(); renderHome(`${APP.route.rig} was removed.`); return; }
    if (cur.X && doc.ver !== cur.X.ver){ if (APP.justImported !== doc.ver) toast(`${cur.rig} was updated from a newer workbook. Loading it…`, 4000); openRig(cur.rig); return; }
    if (cur.X) cur.X.doc = doc;
    return;
  }
  route();
}
async function boot(){
  $('#fbInput').addEventListener('blur', () => { commitInput(); });
  $('#fbRevert').addEventListener('click', () => { if (SEL.si < 0) return; applyLocalEdit(APP.cur.X, SEL.si, SEL.r, SEL.c, {k: 'r'}); toast('Restored the Excel value', 2500); });
  renderHome();
  if (window.__AMP_DEV_DB){ APP.db = window.__AMP_DEV_DB; APP.dev = true; APP.me = {id: 'dev-' + TAB_ID, name: 'You'}; APP.canAdmin = true; }
  else if (typeof SUPA !== 'undefined' && window.AMP_CONFIG && AMP_CONFIG.url && AMP_CONFIG.key){
    AUTH.load();
    APP.db = SUPA.connect(AMP_CONFIG, {pin: () => AUTH.pin, by: () => AUTH.name || null});
    APP.db.onOnline(() => SYNC.status());
    APP.user = {profiles: async ids => Object.fromEntries(ids.map(id => [id, {name: String(id)}]))};   // people are identified by the name they enter
    APP.me = {id: AUTH.name || null, name: AUTH.name || ''};
    if (AUTH.pin) verifySavedPin();
  }
  if (!APP.db){
    $('#main').innerHTML = '<div class="card"><h3>Live data is not available here</h3><p class="muted">This page is not connected to its database: the Supabase address and key (AMP_CONFIG) are missing from the page.</p></div>';
    return;
  }
  APP.db.collection('rigs').onSnapshot(onRigs, err => { console.warn(err); $('#main').innerHTML = `<div class="card"><h3>Could not load the rigs</h3><p class="muted">${esc(err && err.message || err && err.code || err)}. Reload the page to try again.</p></div>`; });
  window.addEventListener('hashchange', route);
  route();
}
window.AMP = {APP, FX, prepareImport, buildDocs, boot, ENGINE, importFlow, debug: {extent, buildBlocks, detectTables, tableModel, renderSheet, renderTableShell, paintTable, viewRows, reportModel}};
if (!window.__AMP_NO_BOOT) boot();
})();

</script>

</body>
</html>
